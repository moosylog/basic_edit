                                    if (next[b]) next[b] = replaceInObj(next[b], [oldId], newIds[j]);
                                });
                            });
                        }
                    }
                    return next;
                });
            };

            const handleRenameArr = () => {
                const newName = prompt('Rename behavior:', item.name || identifiers[0]);
                if (newName && newName.trim() !== (item.name || identifiers[0])) {
                    const cleanName = newName.trim();
                    updateConfig(prev => {
                        const next = JSON.parse(JSON.stringify(prev));
                        next[blockName][idx].name = cleanName;

                        if (usage > 0) {
                            identifiers.forEach(id => {
                                const regex = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                                next.layer.forEach(l => l.tokens?.forEach(t => { t.text = t.text.replace(regex, `$1${cleanName}`); }));
                            });
                            ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => {
                                if (next[b]) next[b] = replaceInObj(next[b], identifiers, cleanName);
                            });
                        }
                        return next;
                    });
                }
            };

            return (
                <div className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm flex flex-col overflow-hidden mb-3">
                    <div className="flex items-center justify-between p-3 cursor-pointer hover:bg-[color:var(--bg-base)] transition-colors" onClick={() => setExpanded(!expanded)}>
                        <div className="flex items-center gap-2 overflow-hidden">
                            <button className="text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] transition-transform" style={{transform: expanded?'rotate(0)':'rotate(-90deg)'}}>▼</button>
                            <span className="font-bold text-xs truncate">{primaryId}</span>
                            <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${usage>0 ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-red-500/10 text-red-500 border border-red-500/20'}`}>{usage>0 ? `🟢 ${usage}` : `🔴 0`}</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={(e) => { e.stopPropagation(); handleMove(-1); }} disabled={isFirst} className="text-[10px] p-1.5 hover:bg-[color:var(--border-panel)] rounded disabled:opacity-30">↑</button>
                            <button onClick={(e) => { e.stopPropagation(); handleMove(1); }} disabled={isLast} className="text-[10px] p-1.5 hover:bg-[color:var(--border-panel)] rounded disabled:opacity-30">↓</button>
                            <button onClick={(e) => { e.stopPropagation(); handleRenameArr(); }} className="text-[10px] p-1.5 text-[color:var(--text-muted)] hover:text-[color:var(--accent)] hover:bg-[color:var(--accent-soft)] rounded">✎</button>
                            <button onClick={(e) => { e.stopPropagation(); handleDeleteArr(); }} className="text-[10px] p-1.5 text-red-500 hover:bg-red-500/20 rounded">✕</button>
                        </div>
                    </div>
                    {expanded && (
                        <div className="p-3 border-t border-[color:var(--border-panel)] bg-[color:var(--bg-base)]">
                            <ObjectEditor obj={item} depth={1} onChange={(v) => { const arr=[...config[blockName]]; arr[idx]=v; const n={...config, [blockName]: arr}; updateConfig(n); }} />
                        </div>
                    )}
                </div>
            );
        };

        const SmartBlockEditor = ({ blockName, data, config, updateConfig, handleRenameBlockKey, handleDeleteBlockKey }) => {
            if (!Array.isArray(data)) return <ObjectEditor obj={data} onChange={(v) => { const n={...config}; n[blockName]=v; updateConfig(n); }} onRenameKey={(oldK, newK) => handleRenameBlockKey(blockName, oldK, newK)} onRemoveKey={(k) => handleDeleteBlockKey(blockName, k)} depth={0} />;
            return (
                <div className="flex flex-col w-full p-1">
                    {data.map((item, idx) => <SmartBlockItemCard key={idx} item={item} idx={idx} blockName={blockName} config={config} updateConfig={updateConfig} isFirst={idx===0} isLast={idx===data.length-1} />)}
                    <button onClick={() => { const n={...config, [blockName]: [...(config[blockName]||[]), {}]}; updateConfig(n); }} className="w-full py-3 border-2 border-dashed border-[color:var(--border-panel)] rounded-xl text-xs font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] hover:border-[color:var(--accent)] transition-colors shadow-sm">+ Add New</button>
                </div>
            );
        };

        // --- 7. RENDER COMPONENTS ---
        const KeyComponent = memo(({ index, geo, binding, baseBinding, isSelected, onSelect, onSwap, lightingColor, lightingEffect, lightingPeriodMs, lightingPhaseMs, isLightingMode, lightingIcons, showIndices, isPaintMode, onPaintDown, onPaintEnter, isPreviewFlash, previewFlashDurationMs }) => {
            const [isDragOver, setIsDragOver] = useState(false);
            if (geo.hidden) return null;
            const isTrans = binding === '_______' || binding === 'KC_TRNS';
            const isDead = binding === '--' || binding === 'KC_NO';
            const labelText = isTrans && baseBinding && !isLightingMode ? `▽ ${generateAutoLabel(baseBinding)}` : generateAutoLabel(binding);
            const keyFontSize = getKeyFontSize(labelText);
           
            const keyStyle = geo.relative ? { position: 'relative' } : { left: `${geo.x}px`, top: `${geo.y}px`, rotate: geo.r ? `${geo.r}deg` : '0deg', transformOrigin: geo.o || 'center' };

            if (isLightingMode) {
                let labelShadow = null;
                if (lightingColor) {
                    keyStyle.backgroundImage = 'none';
                    keyStyle.backgroundColor = lightingColor;
                    keyStyle.borderColor = lightingColor;
                    const contrast = getContrastColor(lightingColor);
                    keyStyle.color = contrast;
                    labelShadow = contrast === '#000' ? '0 1px 0 rgba(255,255,255,0.5)' : '0 1px 3px rgba(0,0,0,0.55)';
                    // Preview only the effects we know the exact timing for (blink) or a
                    // reasonable universal approximation (breath). Named ambient effects
                    // (Reactive, Comet, Rain, etc.) aren't faked here — we don't have a real
                    // spec for how they actually render, so a guessed animation would mislead
                    // more than it'd help.
                    if (lightingEffect === 'blink') {
                        keyStyle.animation = `key-blink-preview ${Math.max(lightingPeriodMs || 800, 100)}ms steps(1, end) infinite`;
                        keyStyle.animationDelay = `${lightingPhaseMs || 0}ms`;
                    } else if (lightingEffect === 'breath') {
                        keyStyle.animation = `key-breath-preview 2000ms ease-in-out infinite alternate`;
                    }
                }
                if (isPaintMode) keyStyle.cursor = 'crosshair';
                return (
                    <div draggable={!isPaintMode}
                        onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData('text/plain', index); }} onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }} onDragLeave={() => setIsDragOver(false)} onDrop={(e) => { e.preventDefault(); setIsDragOver(false); const src = parseInt(e.dataTransfer.getData('text/plain'), 10); if(!isNaN(src) && src!==index) onSwap(src, index); }}
                        onPointerDown={(e) => { if (isPaintMode) { e.stopPropagation(); onPaintDown(index); } }}
                        onPointerEnter={() => { if (isPaintMode) onPaintEnter(index); }}
                        className={`matrix-key lighting-mode ${!lightingColor ? 'lighting-off' : 'lighting-glow'} ${isDragOver ? 'drag-over' : ''} ${isSelected ? 'selected' : ''}`}
                        style={keyStyle} onClick={(e) => { e.stopPropagation(); onSelect(index); }} title={isPaintMode ? `Click or drag to paint | Matrix: ${index} | LED: ${MATRIX_TO_LED[index]}` : `Matrix: ${index} | LED: ${MATRIX_TO_LED[index]}${lightingEffect && lightingEffect !== 'solid' ? ` | Effect: ${lightingEffect}` : ''}`}>
                       
                        {isPreviewFlash && <div key={`flash-${index}`} className="absolute inset-0 pointer-events-none z-30" style={{ borderRadius: 'inherit', backgroundColor: lightingColor || '#ffc247', animation: `key-preview-flash-overlay ${previewFlashDurationMs || 550}ms ease-out` }} />}
                        {showIndices ? (
                            <div className="flex flex-col items-center justify-center pointer-events-none drop-shadow-md">
                                <span className="text-[14px] font-mono font-bold leading-none text-white opacity-95">L:{MATRIX_TO_LED[index]}</span>
                                <span className="text-[10px] font-mono text-white opacity-60 mt-1">M:{index}</span>
                            </div>
                        ) : (
                            <>
                                {lightingIcons?.length > 0 && <div className="absolute top-1 right-1 flex gap-0.5 pointer-events-none z-10">{lightingIcons.map((ic, i)=><span key={i} className="text-[14px] drop-shadow-md">{ic}</span>)}</div>}
                                <span className="text-clamp pointer-events-none px-1 rounded" style={{ fontSize: `${Math.max(keyFontSize - 1, 8)}px`, textShadow: labelShadow ?? undefined }}>{labelText}</span>
                            </>
                        )}
                    </div>
                );
            }

            return (
                <div draggable={true} onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData('text/plain', index); }} onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }} onDragLeave={() => setIsDragOver(false)} onDrop={(e) => { e.preventDefault(); setIsDragOver(false); const src = parseInt(e.dataTransfer.getData('text/plain'), 10); if(!isNaN(src) && src!==index) onSwap(src, index); }}
                    className={`matrix-key ${isSelected ? 'selected' : ''} ${isTrans ? 'trans' : ''} ${isDead ? 'dead' : ''} ${isDragOver ? 'drag-over' : ''}`}
                    style={keyStyle} onClick={(e) => { e.stopPropagation(); onSelect(index); }} title={`Matrix: ${index}${showIndices ? '' : ' | Drag to swap keys'}`}>
                    {showIndices && <span className="absolute top-0.5 left-1 text-[9px] font-mono font-bold opacity-60 pointer-events-none leading-none">{index}</span>}
                    <span className="text-clamp" style={{ fontSize: `${keyFontSize}px` }}>{labelText}</span>
                </div>
            );
        }, (p, n) => p.isSelected === n.isSelected && p.binding === n.binding && p.baseBinding === n.baseBinding && p.geo === n.geo && p.lightingColor === n.lightingColor && p.lightingEffect === n.lightingEffect && p.lightingPeriodMs === n.lightingPeriodMs && p.lightingPhaseMs === n.lightingPhaseMs && p.isLightingMode === n.isLightingMode && JSON.stringify(p.lightingIcons) === JSON.stringify(n.lightingIcons) && p.showIndices === n.showIndices && p.isPaintMode === n.isPaintMode && p.isPreviewFlash === n.isPreviewFlash && p.previewFlashDurationMs === n.previewFlashDurationMs);

        const KeyboardContainer = ({ layerTokens, baseTokens, selectedKey, onSelectKey, scale, pan, isPanning, onPanStart, onPanMove, onPanEnd, onSwap, lightingScenes, isLightingMode, showIndices, isPaintMode, onPaintDown, onPaintEnter, previewFlashes, previewFlashDurationMs }) => {
            const { keyboardGeo, isFallback } = useMemo(() => {
                const count = layerTokens.length;
                if (count === 84) return { keyboardGeo: GLOVE80_GEO, isFallback: false };
                return { keyboardGeo: layerTokens.map(() => ({ x: 0, y: 0, relative: true, hidden: false })), isFallback: true };
            }, [layerTokens.length]);
           
            return (
                <div id="matrix-drag-surface" className="w-full h-full flex items-center justify-center overflow-hidden touch-none" onPointerDown={isPaintMode ? undefined : onPanStart} onPointerMove={isPaintMode ? undefined : onPanMove} onPointerUp={onPanEnd} onPointerCancel={onPanEnd} onPointerLeave={onPanEnd} onClick={() => onSelectKey(null)}>
                    <div id="keyboard-inner" className={isFallback ? "grid grid-cols-12 gap-2 p-10 transition-transform origin-center" : "relative w-[1260px] h-[450px] origin-center transition-transform pointer-events-auto"} style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})`, transitionDuration: isPanning ? '0ms' : '150ms' }}>
                        {layerTokens.map((token, index) => {
                            let color = null; let icons = []; let effect = null; let periodMs = 800; let phaseMs = 0;
                            if (isLightingMode && lightingScenes) {
                                const ledIndex = MATRIX_TO_LED[index];
                                const stack = lightingScenes.filter(s => s.led === ledIndex);
                                if (stack.length > 0) {
                                    const winner = stack[stack.length - 1];
                                    color = winner.color;
                                    effect = winner.effect || 'solid';
                                    if (winner.period_ms) periodMs = winner.period_ms;
                                    if (winner.phase_ms) phaseMs = winner.phase_ms;
                                    if (stack.some(s => s.battery)) icons.push('🔋');
                                    if (stack.some(s => s.connection)) {
                                        // Safe optional chaining protects against undefined crashes here
                                        if (stack.some(s => s.connection?.usb_connected !== undefined)) icons.push('🔌');
                                        else icons.push('📶');
                                    }
                                    if (stack.some(s => s.caps_lock)) icons.push('🔠');
                                    if (stack.some(s => s.num_lock)) icons.push('🔢');
                                    if (stack.some(s => s.scroll_lock)) icons.push('📜');
                                    if (stack.some(s => s.effects)) icons.push('✨');
                                    if (stack.some(s => s.layer?.active && !s.battery && !s.connection && !s.caps_lock && !s.num_lock && !s.scroll_lock && !s.effects)) icons.push('🎯');
                                }
                            }
                            return <KeyComponent key={`matrix-key-${index}`} index={index} geo={keyboardGeo[index] || {hidden: true}} binding={token} baseBinding={baseTokens?.[index]} isSelected={selectedKey === index} onSelect={onSelectKey} onSwap={onSwap} lightingColor={color} lightingEffect={effect} lightingPeriodMs={periodMs} lightingPhaseMs={phaseMs} isLightingMode={isLightingMode} lightingIcons={icons} showIndices={showIndices} isPaintMode={isPaintMode} onPaintDown={onPaintDown} onPaintEnter={onPaintEnter} isPreviewFlash={previewFlashes && previewFlashes[index] !== undefined} previewFlashDurationMs={previewFlashDurationMs} />;
                        })}
                    </div>
                </div>
            );
        };

        const EffectsPanel = ({ config, updateConfig, setSelectedKey, setActiveLayer, setView, isPreviewingEffect, setIsPreviewingEffect }) => {
            const lighting = config.lighting || {};
            const staticRules = (lighting.scene || []).map((s, i) => ({ ...s, _kind: 'scene', _idx: i }));
            const condRules = (lighting.conditional_scene || []).map((s, i) => ({ ...s, _kind: 'conditional_scene', _idx: i }));
            const allRules = [...staticRules, ...condRules];

            const updateGlobalEffect = (field, val) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next.lighting) next.lighting = {};
                    if (!next.lighting.effects) next.lighting.effects = {};
                    next.lighting.effects[field] = val;
                    return next;
                });
            };

            const updateRuleEffect = (kind, idx, val) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next.lighting[kind][idx].effect = val;
                    return next;
                });
            };

            const getBadge = (r) => {
                if (r._kind !== 'conditional_scene') return { icon: '💡', title: 'Static Color' };
                if (r.battery) return { icon: '🔋', title: `Battery (Node ${r.battery.node ?? 0})` };
                if (r.connection) return { icon: r.connection.usb_connected !== undefined ? '🔌' : '📶', title: r.connection.profile !== undefined ? `BLE Profile ${r.connection.profile + 1}` : 'USB Connection' };
                if (r.caps_lock) return { icon: '🔠', title: 'Caps Lock Active' };
                if (r.num_lock) return { icon: '🔢', title: 'Num Lock Active' };
                if (r.scroll_lock) return { icon: '📜', title: 'Scroll Lock Active' };
                if (r.effects) return { icon: '✨', title: `RGB Effects ${r.effects.enabled ? 'Enabled' : 'Disabled'}` };
                return { icon: '🎯', title: 'Layer Active' };
            };

            const jumpToKey = (matrixIdx, layerNum) => {
                if (matrixIdx === undefined || matrixIdx < 0) return;
                if (typeof layerNum === 'number') setActiveLayer(layerNum);
                setSelectedKey(matrixIdx);
                setView('lighting');
            };

            const knownAmbientEffectNames = ['Ripple', 'Reactive', 'Sparkle', 'Comet', 'Rain', 'Crosshair'];
            const knownPalettes = ['Amber', 'Polarized', 'Viridis'];
            const knownRuleEffects = ['solid', 'blink', 'breath'];
            const knownEffectKeys = ['effect', 'palette', 'value', 'speed'];
            const extraEffectFields = Object.fromEntries(Object.entries(lighting.effects || {}).filter(([k]) => !knownEffectKeys.includes(k)));
            const [showAdvancedEffects, setShowAdvancedEffects] = useState(Object.keys(extraEffectFields).length > 0);

            return (
                <div className="flex flex-col gap-4 w-full h-full">
                    <div className="px-2 border-b border-[color:var(--border-panel)] pb-3">
                        <h4 className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest">All Effects In This File</h4>
                        <p className="text-[9px] text-[color:var(--text-muted)] italic mt-1">Every effect used anywhere in your lighting config, in one place. Blink/Breath rules preview their real timing on the Lighting canvas. Named ambient effects (Reactive, Comet, Rain, etc.) can be simulated with the Preview button below — pacing follows your configured Speed, and Sparkle/Rain/Comet get a distinct flash pattern, but it's still a stylized simulation, not an exact reproduction of your firmware's real rendering.</p>
                    </div>

                    <div className="flex-1 overflow-y-auto flex flex-col gap-2 px-0.5">
                        <div className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-3 shadow-sm">
                            <div className="flex items-center gap-2 mb-2">
                                <span className="text-xs font-bold text-[color:var(--text-main)]">🌐 Global Ambient Effect</span>
                            </div>
                            <EnumField label="Effect" value={lighting.effects?.effect ?? ''} onChange={v => updateGlobalEffect('effect', v)} knownOptions={knownAmbientEffectNames} />
                            <EnumField label="Palette" value={lighting.effects?.palette ?? ''} onChange={v => updateGlobalEffect('palette', v)} knownOptions={knownPalettes} />
                            <SliderField label="Value" value={lighting.effects?.value} onChange={v => updateGlobalEffect('value', v)} />
                            <SliderField label="Speed" value={lighting.effects?.speed} onChange={v => updateGlobalEffect('speed', v)} />

                            <button type="button" onClick={() => setIsPreviewingEffect(p => !p)} className={`w-full mt-2 py-2 rounded-lg text-xs font-bold border transition-all flex items-center justify-center gap-2 ${isPreviewingEffect ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-[color:var(--accent-soft)] border-[color:var(--accent)] text-[color:var(--accent)] hover:brightness-110'}`}>
                                {isPreviewingEffect ? '■ Stop Preview' : `▶ Preview "${lighting.effects?.effect || 'Effect'}" (simulated key presses)`}
                            </button>
                            {isPreviewingEffect && <p className="text-[9px] text-[color:var(--text-muted)] italic mt-1 text-center">Watch the canvas — random keys are flashing to simulate presses.</p>}

                            <button type="button" onClick={() => setShowAdvancedEffects(s => !s)} className="text-[9px] font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] mt-1">
                                {showAdvancedEffects ? '▾ Hide advanced fields' : '▸ Advanced fields'}
                            </button>
                            {showAdvancedEffects && (
                                <div className="mt-2 pt-2 border-t border-dashed border-[color:var(--border-panel)]">
                                    <ObjectEditor obj={extraEffectFields} onChange={(val) => {
                                        updateConfig(prev => {
                                            const next = JSON.parse(JSON.stringify(prev));
                                            if (!next.lighting) next.lighting = {};
                                            const current = next.lighting.effects || {};
                                            next.lighting.effects = { effect: current.effect, palette: current.palette, value: current.value, speed: current.speed, ...val };
                                            return next;
                                        });
                                    }} depth={1} />
                                    <p className="text-[9px] text-[color:var(--text-muted)] italic mt-1">Per-effect tuning tables (like a "params" table with Crosshair/Comet/Rain settings) and any other extra fields your firmware supports show up here.</p>
                                </div>
                            )}
                        </div>

                        {allRules.length === 0 ? (
                            <div className="flex-1 flex items-center justify-center text-[color:var(--text-muted)] text-[11px] font-medium text-center p-6 border border-dashed border-[color:var(--border-panel)] rounded-xl bg-[color:var(--bg-base)] m-1">
                                No per-key lighting rules yet. Head to the Lighting tab and try Paint Mode.
                            </div>
                        ) : allRules.map(r => {
                            const matrixIdx = r.led !== undefined ? LED_TO_MATRIX[r.led] : -1;
                            const layerNum = typeof r.layer === 'object' ? r.layer?.layer : r.layer;
                            const badge = getBadge(r);
                            return (
                                <div key={`${r._kind}-${r._idx}`} className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-3 shadow-sm flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full border border-[color:var(--border-panel)] shrink-0" style={{ backgroundColor: r.color || 'transparent' }} title={r.color || 'no color'} />
                                    <div className="flex-1 min-w-0">
                                        <div className="text-[11px] font-bold truncate text-[color:var(--text-main)]">{badge.icon} {badge.title}</div>
                                        <div className="text-[9px] text-[color:var(--text-muted)]">LED {r.led} · Matrix {matrixIdx >= 0 ? matrixIdx : '—'} · {getLayerLabel(config, layerNum)}</div>
                                    </div>
                                    <div className="w-28 shrink-0">
                                        <EnumField value={r.effect ?? 'solid'} onChange={v => updateRuleEffect(r._kind, r._idx, v)} knownOptions={knownRuleEffects} />
                                    </div>
                                    <button onClick={() => jumpToKey(matrixIdx, layerNum)} title="Jump to key" className="text-[13px] text-[color:var(--text-muted)] hover:text-[color:var(--accent)] shrink-0 p-1">↗</button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Inspector = ({ view, setView, config, activeLayer, setActiveLayer, selectedKey, setSelectedKey, updateConfig, tabs, isDockedBottom, toggleDock, handleRenameBlockKey, handleDeleteBlockKey, showIndices, setShowIndices, clipboard, setClipboard, isPaintMode, setIsPaintMode, paintColor, setPaintColor, isPreviewingEffect, setIsPreviewingEffect }) => {
            const [editMode, setEditMode] = useState('visual');
            const [localObj, setLocalObj] = useState(null);
            const [localStr, setLocalStr] = useState("");
            const [error, setError] = useState("");
            const [pendingGuidedAction, setPendingGuidedAction] = useState(null); // 'usb' | 'ble' | 'battery' — set by the Lighting tab's guided entry points, consumed by KeyLightingEditor
            useEffect(() => { if (selectedKey === null) setPendingGuidedAction(null); }, [selectedKey]);
           
            const currentTokenText = selectedKey !== null && config.layer[activeLayer].tokens ? config.layer[activeLayer].tokens[selectedKey]?.text || "" : "";

            useEffect(() => {
                if (view !== 'lighting' && selectedKey !== null) setView('key');
                else if (view === 'key' && selectedKey === null) setView('layer_meta');
            }, [selectedKey]);

            useEffect(() => {
                setError(""); setEditMode('visual');
                if (view === 'key') { setLocalStr(currentTokenText); }
                else if (view === 'tracker' || view === 'lighting' || view === 'effects') { setLocalStr(""); }
                else if (view === 'raw_toml') {
                    const toSerialize = JSON.parse(JSON.stringify(config));
                    toSerialize.layer.forEach(l => { if(l.tokens) { l.keys = untokenizeKeys(l); delete l.tokens; delete l.tail; }});
                    setLocalStr(window.smolToml.stringify(toSerialize));
                } else if (view === 'layer_meta') {
                    const l = config.layer[activeLayer];
                    setLocalObj({ id: l.id || '', name: l.name || '' });
                } else {
                    const block = config[view];
                    const objData = block ? JSON.parse(JSON.stringify(block)) : (['morse', 'hold_tap', 'combo', 'macro'].includes(view) ? [] : {});
                    setLocalObj(objData); setLocalStr(window.smolToml.stringify({ [view]: objData }));
                }
            }, [view, selectedKey, activeLayer, config, currentTokenText]);

            const handleModeToggle = () => {
                setError("");
                if (editMode === 'visual') {
                    try { setLocalStr(window.smolToml.stringify(view === 'layer_meta' ? localObj : { [view]: localObj })); setEditMode('raw'); } catch(e) { setError("Serialization failed."); }
                } else {
                    try { const parsed = window.smolToml.parse(localStr); setLocalObj(view === 'layer_meta' ? parsed : parsed[view]); setEditMode('visual'); } catch(e) { setError("Invalid TOML syntax."); }
                }
            };

            const handleSave = () => {
                try {
                    let safeValue, layerMetaData, blockData;
                    if (view === 'key') {
                        if (selectedKey === null) return;
                        safeValue = localStr.trim().replace(/\s+/g, '');
                        if (!safeValue) throw new Error("Keycode cannot be empty.");
                    } else if (view === 'layer_meta') {
                        layerMetaData = editMode === 'visual' ? localObj : window.smolToml.parse(localStr);
                    } else if (view !== 'raw_toml' && view !== 'tracker' && view !== 'lighting' && view !== 'effects') {
                        blockData = editMode === 'visual' ? localObj : window.smolToml.parse(localStr)[view];
                    }
                    updateConfig(prev => {
                        const newConfig = JSON.parse(JSON.stringify(prev));
                        if (view === 'key') {
                            newConfig.layer[activeLayer].tokens[selectedKey].text = safeValue;
                        } else if (view === 'layer_meta') {
                            if (layerMetaData.id !== undefined) newConfig.layer[activeLayer].id = layerMetaData.id;
                            if (layerMetaData.name !== undefined) newConfig.layer[activeLayer].name = layerMetaData.name;
                        } else if (view !== 'raw_toml' && view !== 'tracker' && view !== 'lighting' && view !== 'effects') {
                            if (blockData !== undefined && Object.keys(blockData).length > 0) newConfig[view] = blockData; else delete newConfig[view];
                        }
                        return newConfig;
                    });
                    setError("");
                } catch (err) { setError(err.message); }
            };

            const handleCopy = () => {
                if (selectedKey === null) return;
                if (view === 'key') {
                    setClipboard({ type: 'key', data: config.layer[activeLayer].tokens[selectedKey].text });
                } else if (view === 'lighting') {
                    const led = MATRIX_TO_LED[selectedKey];
                    const staticRules = config.lighting?.scene?.filter(s => s.led === led && (s.layer === activeLayer || s.layer === undefined)) || [];
                    const condRules = config.lighting?.conditional_scene?.filter(s => s.led === led && ((typeof s.layer === 'object' ? s.layer?.layer : s.layer) === activeLayer || s.layer === undefined)) || [];
                    setClipboard({ type: 'lighting', data: { staticRules, condRules } });
                }
            };

            const handlePaste = () => {
                if (selectedKey === null || !clipboard) return;

                if (view === 'key' && clipboard.type === 'key') {
                    updateConfig(prev => {
                        const next = JSON.parse(JSON.stringify(prev));
                        next.layer[activeLayer].tokens[selectedKey].text = clipboard.data;
                        return next;
                    });
                } else if (view === 'lighting' && clipboard.type === 'lighting') {
                    const led = MATRIX_TO_LED[selectedKey];
                    if (led === -1) return alert("Selected key has no physical LED to paste onto.");
                    updateConfig(prev => {
                        const next = JSON.parse(JSON.stringify(prev));
                        if (!next.lighting) next.lighting = {};
                        if (!next.lighting.scene) next.lighting.scene = [];
                        if (!next.lighting.conditional_scene) next.lighting.conditional_scene = [];

                        next.lighting.scene = next.lighting.scene.filter(s => !(s.led === led && (s.layer === activeLayer || s.layer === undefined)));
                        next.lighting.conditional_scene = next.lighting.conditional_scene.filter(s => !(s.led === led && ((typeof s.layer === 'object' ? s.layer?.layer : s.layer) === activeLayer || s.layer === undefined)));

                        clipboard.data.staticRules.forEach(r => next.lighting.scene.push({ ...r, led, layer: activeLayer }));
                        clipboard.data.condRules.forEach(r => {
                            const rebasedLayer = (r.layer && typeof r.layer === 'object') ? { ...r.layer, layer: activeLayer } : activeLayer;
                            next.lighting.conditional_scene.push({ ...r, led, layer: rebasedLayer });
                        });
                        return next;
                    });
                }
            };

            const isDynamicBlock = !['key', 'layer_meta', 'tracker', 'raw_toml', 'lighting', 'effects'].includes(view);

            return (
                <div className={`flex flex-col h-full overflow-hidden w-full bg-[color:var(--bg-panel)] ${isDockedBottom ? 'border-t' : 'border-l'} border-[color:var(--border-panel)]`}>
                    <div className="flex items-center text-xs font-semibold border-b border-[color:var(--border-panel)] bg-[color:var(--bg-base)]">
                        <div className="flex overflow-x-auto hide-scrollbar flex-1">
                            {tabs.map(t => (
                                <button key={t} onClick={() => { setView(t); if(t !== 'key' && t !== 'lighting') setSelectedKey(null); }}
                                    className={`shrink-0 min-w-[75px] py-3.5 px-4 text-center capitalize transition-colors focus:outline-none whitespace-nowrap ${view === t ? 'text-[color:var(--accent)] border-b-2 border-[color:var(--accent)] panel' : 'text-[color:var(--text-muted)] hover:text-[color:var(--text-main)]'}`}>
                                    {t.replace('_', ' ')}
                                </button>
                            ))}
                        </div>
                        <div className="flex gap-2 pr-4 pl-2 shrink-0 border-l border-[color:var(--border-panel)] ml-2 h-full items-center">
                            <button onClick={toggleDock} title={isDockedBottom ? "Dock to Right" : "Dock to Bottom"} className="text-[color:var(--text-muted)] hover:text-[color:var(--accent)] p-1 transition-colors">
                                {isDockedBottom ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg> : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>}
                            </button>
                        </div>
                    </div>

                    <div className={`p-4 flex-1 flex flex-col overflow-y-auto ${isDockedBottom ? 'flex-row gap-6' : ''}`}>
                        {view !== 'lighting' && view !== 'effects' && (
                            <div className={`flex flex-col ${isDockedBottom ? 'w-1/3 shrink-0' : 'mb-4'}`}>
                                <div className="mb-4 flex justify-between items-center shrink-0">
                                    <h3 className="font-bold text-sm capitalize flex items-center gap-2">
                                        {view === 'key' ? (selectedKey !== null ? (
                                            <span className="flex items-baseline gap-2">
                                                <span>{getLayerLabel(config, activeLayer)}</span>
                                                <span className="text-[color:var(--text-muted)] font-mono text-xs font-normal">Matrix {selectedKey}{MATRIX_TO_LED[selectedKey] >= 0 ? ` · LED ${MATRIX_TO_LED[selectedKey]}` : ' · no LED'}</span>
                                            </span>
                                        ) : 'No Key Selected') : `${view.replace('_', ' ')}`}
                                    </h3>
                                    <div className="flex gap-2 items-center">
                                        {view === 'key' && selectedKey !== null && (
                                            <div className="flex gap-1 bg-[color:var(--bg-base)] p-1 rounded-lg border border-[color:var(--border-panel)]">
                                                <button onClick={handleCopy} className="text-[10px] px-2 py-1 font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] transition-colors">Copy</button>
                                                <button onClick={handlePaste} disabled={!clipboard || clipboard.type !== 'key'} className="text-[10px] px-2 py-1 font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] disabled:opacity-30 transition-colors">Paste</button>
                                            </div>
                                        )}
                                        {(isDynamicBlock || view === 'layer_meta') && (
                                            <div className="flex bg-[color:var(--bg-base)] border border-[color:var(--border-panel)] rounded-lg p-0.5 shadow-sm">
                                                <button onClick={handleModeToggle} disabled={editMode === 'visual'} className={`px-2.5 py-1 text-[10px] font-bold rounded-md transition-all ${editMode === 'visual' ? 'bg-[color:var(--bg-panel)] text-[color:var(--text-main)] shadow-sm' : 'text-[color:var(--text-muted)] hover:text-[color:var(--text-main)]'}`}>Visual</button>
                                                <button onClick={handleModeToggle} disabled={editMode === 'raw'} className={`px-2.5 py-1 text-[10px] font-bold rounded-md transition-all ${editMode === 'raw' ? 'bg-[color:var(--bg-panel)] text-[color:var(--text-main)] shadow-sm' : 'text-[color:var(--text-muted)] hover:text-[color:var(--text-main)]'}`}>Raw TOML</button>
                                            </div>
                                        )}
                                        {view === 'key' && selectedKey !== null && <button onClick={() => setSelectedKey(null)} className="text-[10px] font-bold text-[color:var(--text-muted)] hover:text-red-500 transition-colors ml-2">✕</button>}
                                    </div>
                                </div>
                                <p className="text-[11px] text-[color:var(--text-muted)] mb-4 leading-relaxed shrink-0">
                                    {view === 'key' ? "Modify raw RMK keycode binding (e.g. KC_A, TD(0), --)." :
                                     view === 'raw_toml' ? "Live Egress Stream. This is the exact compiled TOML file ready for RMK firmware." :
                                     editMode === 'visual' ? `Fully graphical editor for the [${view}] block.` : `Raw TOML text editor for the [${view}] block.`}
                                </p>
                                {error && <div className="text-red-500 text-[11px] mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg font-bold shrink-0">{error}</div>}
                            </div>
                        )}

                        <div className={`flex flex-col flex-1 relative min-h-0 ${isDockedBottom ? 'overflow-y-auto pr-2 hide-scrollbar' : ''}`}>
                            {view === 'tracker' ? (
                                <TrackerPanel config={config} updateConfig={updateConfig} />
                            ) : view === 'effects' ? (
                                <EffectsPanel config={config} updateConfig={updateConfig} setSelectedKey={setSelectedKey} setActiveLayer={setActiveLayer} setView={setView} isPreviewingEffect={isPreviewingEffect} setIsPreviewingEffect={setIsPreviewingEffect} />
                            ) : view === 'lighting' ? (
                                <>
                                    {selectedKey !== null && (
                                        <div className="absolute top-2 right-4 flex gap-2 bg-[color:var(--bg-panel)] p-1 rounded-lg border border-[color:var(--border-panel)] shadow-sm z-50">
                                            <button onClick={handleCopy} className="text-[10px] px-3 py-1.5 font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] transition-colors">Copy Rules</button>
                                            <button onClick={handlePaste} disabled={!clipboard || clipboard.type !== 'lighting'} className="text-[10px] px-3 py-1.5 font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] disabled:opacity-30 transition-colors">Paste Rules</button>
                                        </div>
                                    )}
                                    {selectedKey === null ? (
                                        <LightingDashboard config={config} activeLayer={activeLayer} showIndices={showIndices} setShowIndices={setShowIndices} updateConfig={updateConfig} isPaintMode={isPaintMode} setIsPaintMode={setIsPaintMode} paintColor={paintColor} setPaintColor={setPaintColor} pendingGuidedAction={pendingGuidedAction} setPendingGuidedAction={setPendingGuidedAction} setSelectedKey={setSelectedKey} />
                                    ) : (
                                        <KeyLightingEditor config={config} updateConfig={updateConfig} activeLayer={activeLayer} selectedKey={selectedKey} setSelectedKey={setSelectedKey} pendingGuidedAction={pendingGuidedAction} setPendingGuidedAction={setPendingGuidedAction} />
                                    )}
                                </>
                            ) : (view !== 'key' || selectedKey !== null) ? (
                                <>
                                    {view === 'key' ? (
                                        <input className={`input-field font-mono text-sm mb-4 shrink-0 ${error ? 'border-red-500' : ''}`} style={{color: 'var(--accent)'}} value={localStr} onChange={e => setLocalStr(e.target.value)} spellCheck="false" />
                                    ) : editMode === 'raw' || view === 'raw_toml' ? (
                                        <textarea readOnly={view === 'raw_toml'} className={`input-field font-mono text-[10px] resize-none mb-4 flex-1 ${view==='raw_toml' ? 'opacity-80' : ''} ${error ? 'border-red-500' : ''}`} style={{color: 'var(--accent)'}} value={localStr} onChange={e => setLocalStr(e.target.value)} spellCheck="false" />
                                    ) : (
                                        <div className="flex-1 overflow-y-auto mb-4 bg-white dark:bg-[color:var(--bg-base)] border border-[color:var(--border-panel)] rounded-xl shadow-sm">
                                            {localObj && isDynamicBlock ? (
                                                <SmartBlockEditor blockName={view} data={localObj} config={config} updateConfig={updateConfig} handleRenameBlockKey={handleRenameBlockKey} handleDeleteBlockKey={handleDeleteBlockKey} />
                                            ) : localObj ? (
                                                <div className="p-1"><ObjectEditor obj={localObj} onChange={setLocalObj} depth={0} /></div>
                                            ) : null}
                                        </div>
                                    )}
                                    {view !== 'raw_toml' && <button onClick={handleSave} className={`bg-[color:var(--accent)] hover:brightness-110 text-white font-bold py-3.5 rounded-lg transition-all text-sm shadow-md mt-auto shrink-0 sticky bottom-0 ${isDockedBottom ? 'w-1/3 self-end' : 'w-full mt-auto'}`}>Save Changes</button>}
                                </>
                            ) : (
                                <div className="flex-1 flex items-center justify-center text-[color:var(--text-muted)] text-[11px] font-medium text-center p-6 border border-dashed border-[color:var(--border-panel)] rounded-xl bg-[color:var(--bg-base)]">
                                    Select a physical key on the board to edit its binding properties.
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Undo/redo as a drop-in replacement for useState: setPresent has the exact same
        // calling convention (value or updater function), so it can replace setConfig
        // everywhere it's already used without touching those call sites. Rapid successive
        // changes within `coalesceMs` of each other (e.g. typing in a hex color field one
        // character at a time) are merged into a single undo step instead of one per keystroke.
        const useUndoableState = (initialValue, coalesceMs = 700) => {
            const [history, setHistory] = useState({ past: [], present: initialValue, future: [] });
            const lastPushRef = useRef(0);

            const setPresent = useCallback((updater) => {
                setHistory(h => {
                    const newPresent = typeof updater === 'function' ? updater(h.present) : updater;
                    if (newPresent === h.present) return h;
                    const now = Date.now();
                    const shouldCheckpoint = now - lastPushRef.current > coalesceMs;
                    lastPushRef.current = now;
                    return {
                        past: shouldCheckpoint ? [...h.past.slice(-49), h.present] : h.past,
                        present: newPresent,
                        future: []
                    };
                });
            }, [coalesceMs]);

            const undo = useCallback(() => {
                lastPushRef.current = 0; // force the next edit after an undo to start a fresh checkpoint
                setHistory(h => {
                    if (h.past.length === 0) return h;
                    const previous = h.past[h.past.length - 1];
                    return { past: h.past.slice(0, -1), present: previous, future: [h.present, ...h.future] };
                });
            }, []);

            const redo = useCallback(() => {
                lastPushRef.current = 0;
                setHistory(h => {
                    if (h.future.length === 0) return h;
                    const next = h.future[0];
                    return { past: [...h.past, h.present], present: next, future: h.future.slice(1) };
                });
            }, []);

            const resetHistory = useCallback((newPresent) => {
                lastPushRef.current = 0;
                setHistory({ past: [], present: newPresent, future: [] });
            }, []);

            return { present: history.present, setPresent, undo, redo, resetHistory, canUndo: history.past.length > 0, canRedo: history.future.length > 0 };
        };

        const App = () => {
            const [engineReady, setEngineReady] = useState(false);
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('rmk-theme');
                if (saved === 'dark' || saved === 'light') return saved;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            });
            const { present: config, setPresent: setConfig, undo: undoConfig, redo: redoConfig, resetHistory: resetConfigHistory, canUndo, canRedo } = useUndoableState(null);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const isModifier = e.ctrlKey || e.metaKey;
                    if (!isModifier) return;
                    const tag = document.activeElement?.tagName;
                    const isEditableFocus = tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable;
                    if (isEditableFocus) return; // let native text-field undo/redo handle it there
                    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undoConfig(); }
                    else if ((e.key === 'z' && e.shiftKey) || e.key === 'y') { e.preventDefault(); redoConfig(); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [undoConfig, redoConfig]);
            const [activeLayer, setActiveLayer] = useState(0);
            const [selectedKey, setSelectedKey] = useState(null);
            const [clipboard, setClipboard] = useState(null);
           
            const [scale, setScale] = useState(0.85);
            const [pan, setPan] = useState({ x: 0, y: -60 });
            const canvasWrapperRef = useRef(null);
            const toolbarRef = useRef(null);
            const KB_NATURAL_W = 1260, KB_NATURAL_H = 450;

            const autoFitCanvas = useCallback(() => {
                const el = canvasWrapperRef.current;
                if (!el) return;
                const { clientWidth: w, clientHeight: h } = el;
                if (w === 0 || h === 0) return;
                const tokenCount = config?.layer?.[activeLayer]?.tokens?.length || 0;
                if (tokenCount !== 84) return; // non-standard (fallback grid) layout — its own flow/wrap sizing, not a fixed-size canvas to fit

                // Measure the toolbar's actual rendered footprint instead of guessing a fixed
                // pixel value — it's absolutely positioned inside this same container, so it
                // never reduces clientHeight even though it visually covers part of it.
                const toolbarH = toolbarRef.current ? toolbarRef.current.getBoundingClientRect().height : 40;
                const chromeReserve = toolbarH + 24 /* top-6 offset */ + 16 /* breathing room */;

                // The keyboard is vertically centered, so reserving clearance at the top costs
                // double from the fit budget (half comes off the top margin, half off the
                // bottom, to keep it centered while still clearing the toolbar).
                const effectiveH = Math.max(h - chromeReserve * 2, 80);
                const fitScale = Math.min(w / KB_NATURAL_W, effectiveH / KB_NATURAL_H) * 0.94;
                const clampedScale = Math.max(0.2, Math.min(2.0, fitScale));
                setScale(clampedScale);
                setPan({ x: 0, y: 0 });

                // Verification pass: after the browser has actually painted the new scale,
                // measure the real rendered keyboard against the real wrapper bounds. If it
                // still overflows for any reason this calculation didn't anticipate, shrink
                // further until it genuinely fits — correct by measurement, not by assumption.
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    const wrapperEl = canvasWrapperRef.current;
                    const kbEl = document.getElementById('keyboard-inner');
                    if (!wrapperEl || !kbEl) return;
                    const wrapperRect = wrapperEl.getBoundingClientRect();
                    const kbRect = kbEl.getBoundingClientRect();
                    const topOverflow = Math.max(0, wrapperRect.top - kbRect.top);
                    const bottomOverflow = Math.max(0, kbRect.bottom - wrapperRect.bottom);
                    const worstOverflow = Math.max(topOverflow, bottomOverflow);
                    if (worstOverflow > 2 && kbRect.height > 0) {
                        const correctionFactor = Math.max(0.1, (kbRect.height - worstOverflow * 2) / kbRect.height);
                        setScale(s => Math.max(0.2, s * correctionFactor));
                    }
                }));
            }, [config, activeLayer]);
            const [isPanning, setIsPanning] = useState(false);
            const [panStart, setPanStart] = useState({ x: 0, y: 0 });
           
            const [leftWidth, setLeftWidth] = useState(288);
            const [rightWidth, setRightWidth] = useState(420);
            const [bottomHeight, setBottomHeight] = useState(320);
            const [dockMode, setDockMode] = useState('bottom');

            useEffect(() => {
                const el = canvasWrapperRef.current;
                if (!el || !config) return;
                autoFitCanvas();
                const observer = new ResizeObserver(() => autoFitCanvas());
                observer.observe(el);
                return () => observer.disconnect();
            }, [config, dockMode, autoFitCanvas]);
            const [view, setView] = useState('key');
           
            const [showIndices, setShowIndices] = useState(false);
            const [isPaintMode, setIsPaintMode] = useState(false);
            const [paintColor, setPaintColor] = useState('#0050ff');
            const isPaintingRef = useRef(false);

            useEffect(() => {
                const stop = () => { isPaintingRef.current = false; };
                window.addEventListener('pointerup', stop);
                window.addEventListener('pointercancel', stop);
                return () => { window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); };
            }, []);

            const handlePaintKey = useCallback((matrixIdx) => {
                const led = MATRIX_TO_LED[matrixIdx];
                if (led === -1 || led === undefined) return;
                setConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next.lighting) next.lighting = {};
                    if (!Array.isArray(next.lighting.scene)) next.lighting.scene = [];
                    const existingIdx = next.lighting.scene.findIndex(s => s.led === led && s.layer === activeLayer);
                    if (existingIdx !== -1) next.lighting.scene[existingIdx] = { ...next.lighting.scene[existingIdx], color: paintColor, effect: next.lighting.scene[existingIdx].effect || 'solid' };
                    else next.lighting.scene.push({ layer: activeLayer, led, color: paintColor, effect: 'solid' });
                    return next;
                });
            }, [activeLayer, paintColor]);

            const handlePaintDown = useCallback((matrixIdx) => { isPaintingRef.current = true; handlePaintKey(matrixIdx); }, [handlePaintKey]);

            // Effect preview: simulates random key presses so reactive-style effects (which
            // need real physical presses to show anything) can be seen animating. Purely a
            // visual simulation layer — never reads or writes config, and stops cleanly.
            const [isPreviewingEffect, setIsPreviewingEffect] = useState(false);
            const [previewFlashes, setPreviewFlashes] = useState({}); // { [matrixIdx]: flashId }
            const [previewFlashDurationMs, setPreviewFlashDurationMs] = useState(550);
            useEffect(() => {
                if (!isPreviewingEffect) { setPreviewFlashes({}); return; }
                const validIndices = MATRIX_TO_LED.map((led, idx) => led >= 0 ? idx : -1).filter(idx => idx >= 0);
                if (validIndices.length === 0) { setIsPreviewingEffect(false); return; }

                const effectName = config?.lighting?.effects?.effect || '';
                const speedVal = config?.lighting?.effects?.speed ?? 128; // 0-255 scale, same convention as Brightness
                // Higher configured speed -> faster ticks. Clamped to a sane range so it's
                // never so fast it's just noise, nor so slow it looks stalled.
                const clampedSpeed = Math.min(Math.max(speedVal, 0), 255);
                const tickInterval = Math.round(900 - (clampedSpeed / 255) * 700); // ~200ms (fast) to ~900ms (slow)

                // Modest, honestly-labeled visual variety by effect-name category — this is
                // still a stylized simulation, not a faithful reproduction of each effect's
                // real algorithm (we don't have specs for those), just enough that different
                // effects don't look visually identical in this preview.
                let flashCountRange = [1, 2], flashDurationMs = 550;
                const nameLower = effectName.toLowerCase();
                if (nameLower.includes('sparkle')) { flashCountRange = [3, 5]; flashDurationMs = 320; }
                else if (nameLower.includes('rain')) { flashCountRange = [2, 4]; flashDurationMs = 420; }
                else if (nameLower.includes('comet') || nameLower.includes('ripple')) { flashCountRange = [1, 1]; flashDurationMs = 750; }
                setPreviewFlashDurationMs(flashDurationMs);

                let flashCounter = 0;
                const pendingTimeouts = [];
                const interval = setInterval(() => {
                    const count = flashCountRange[0] + Math.floor(Math.random() * (flashCountRange[1] - flashCountRange[0] + 1));
                    const picks = {};
                    for (let i = 0; i < count; i++) {
                        const idx = validIndices[Math.floor(Math.random() * validIndices.length)];
                        const flashId = flashCounter++;
                        picks[idx] = flashId;
                        const timeoutId = setTimeout(() => {
                            setPreviewFlashes(prev => {
                                if (prev[idx] !== flashId) return prev; // a newer flash already replaced this one
                                const next = { ...prev };
                                delete next[idx];
                                return next;
                            });
                        }, flashDurationMs);
                        pendingTimeouts.push(timeoutId);
                    }
                    setPreviewFlashes(prev => ({ ...prev, ...picks }));
                }, tickInterval);
                return () => { clearInterval(interval); pendingTimeouts.forEach(clearTimeout); };
            }, [isPreviewingEffect, config?.lighting?.effects?.effect, config?.lighting?.effects?.speed]);
            const handlePaintEnter = useCallback((matrixIdx) => { if (isPaintingRef.current) handlePaintKey(matrixIdx); }, [handlePaintKey]);

            useEffect(() => {
                const r = document.documentElement;
                if (theme === 'dark') r.classList.add('dark'); else r.classList.remove('dark');
                localStorage.setItem('rmk-theme', theme);
                let meta = document.querySelector('meta[name="theme-color"]');
                if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
                meta.content = theme === 'dark' ? '#0a0e14' : '#eef1f5';
            }, [theme]);
            useEffect(() => { const timer = setInterval(() => { if (window.smolToml) { setEngineReady(true); clearInterval(timer); } }, 100); return () => clearInterval(timer); }, []);

            const dynamicTabs = useMemo(() => {
                if (!config) return [];
                const systemTabs = ['key', 'layer_meta', 'lighting', 'effects', 'tracker', 'raw_toml'];
                const existingBlocks = Object.keys(config).filter(k => k !== 'layer');
                const standardBlocks = ['keyboard', 'matrix', 'layout', 'behavior', 'split', 'ble', 'vial', 'storage'];
                return Array.from(new Set([...systemTabs, ...existingBlocks, ...standardBlocks]));
            }, [config]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = window.smolToml.parse(event.target.result);
                        if (!parsed.layer) throw new Error("Missing '[[layer]]' array.");
                        parsed.layer.forEach(l => { const { tokens, tail } = tokenizeKeysString(l.keys || ""); l.tokens = tokens; l.tail = tail; });
                        const { config: repaired, issues } = validateAndRepairConfig(parsed);
                        resetConfigHistory(repaired); setActiveLayer(0); setSelectedKey(null);
                        setDockMode('bottom'); setView('key');
                        if (issues.length > 0) {
                            alert(`Loaded, but found and fixed ${issues.length} issue${issues.length > 1 ? 's' : ''}:\n\n- ${issues.join('\n- ')}`);
                        }
                    } catch (err) { alert("Parse Error: " + err.message); }
                };
                reader.readAsText(file); e.target.value = '';
            };

            const handleExport = () => {
                if (!config) return;
                try {
                    const { config: repaired, issues } = validateAndRepairConfig(JSON.parse(JSON.stringify(config)));
                    repaired.layer.forEach(l => { l.keys = untokenizeKeys(l); delete l.tokens; delete l.tail; });
                    const tomlString = window.smolToml.stringify(repaired);
                    // Confirm what we're about to write is actually parseable before handing it to the user
                    window.smolToml.parse(tomlString);
                    const a = document.createElement('a'); a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(tomlString); a.download = `keyboard.toml`; a.click();
                    if (issues.length > 0) {
                        alert(`Exported, but cleaned up ${issues.length} issue${issues.length > 1 ? 's' : ''} first:\n\n- ${issues.join('\n- ')}`);
                    }
                } catch (err) {
                    alert("Export failed — nothing was written to disk. This is a bug, please report what you were doing right before this happened.\n\nDetails: " + err.message);
                }
            };

            const handlePanStart = (e) => { if (e.target.closest('.matrix-key') && e.button !== 1) return; setIsPanning(true); setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y }); e.currentTarget.setPointerCapture(e.pointerId); };
            const handlePanMove = (e) => { if (!isPanning) return; setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y }); };
            const handlePanEnd = (e) => { setIsPanning(false); e.currentTarget.releasePointerCapture(e.pointerId); };

            const startLeftResize = (e) => {
                e.preventDefault(); e.target.setPointerCapture(e.pointerId);
                const startX = e.clientX; const startW = leftWidth;
                const onMove = (moveEv) => setLeftWidth(Math.max(220, Math.min(window.innerWidth - 400, startW + (moveEv.clientX - startX))));
                const onUp = (upEv) => { e.target.releasePointerCapture(upEv.pointerId); e.target.removeEventListener('pointermove', onMove); e.target.removeEventListener('pointerup', onUp); };
                e.target.addEventListener('pointermove', onMove); e.target.addEventListener('pointerup', onUp);
            };

            const startRightResize = (e) => {
                e.preventDefault(); e.target.setPointerCapture(e.pointerId);
                const startX = e.clientX; const startW = rightWidth;
                const onMove = (moveEv) => setRightWidth(Math.max(300, Math.min(window.innerWidth - 300, startW - (moveEv.clientX - startX))));
                const onUp = (upEv) => { e.target.releasePointerCapture(upEv.pointerId); e.target.removeEventListener('pointermove', onMove); e.target.removeEventListener('pointerup', onUp); };
                e.target.addEventListener('pointermove', onMove); e.target.addEventListener('pointerup', onUp);
            };
           
            const startBottomResize = (e) => {
                e.preventDefault(); e.target.setPointerCapture(e.pointerId);
                const startY = e.clientY; const startH = bottomHeight;
                const onMove = (moveEv) => setBottomHeight(Math.max(200, Math.min(window.innerHeight - 200, startH - (moveEv.clientY - startY))));
                const onUp = (upEv) => { e.target.releasePointerCapture(upEv.pointerId); e.target.removeEventListener('pointermove', onMove); e.target.removeEventListener('pointerup', onUp); };
                e.target.addEventListener('pointermove', onMove); e.target.addEventListener('pointerup', onUp);
            };

            const swapLayers = useCallback((idx1, idx2) => {
                setConfig(prev => {
                    const n = JSON.parse(JSON.stringify(prev));
                    const temp = n.layer[idx1];
                    n.layer[idx1] = n.layer[idx2];
                    n.layer[idx2] = temp;

                    const updateLightingLayer = (rules) => {
                        if (!Array.isArray(rules)) return rules;
                        return rules.map(r => {
                            const l = typeof r.layer === 'object' ? r.layer.layer : r.layer;
                            if (l === idx1) {
                                if (typeof r.layer === 'object') r.layer.layer = idx2; else r.layer = idx2;
                            } else if (l === idx2) {
                                if (typeof r.layer === 'object') r.layer.layer = idx1; else r.layer = idx1;
                            }
                            return r;
                        });
                    };
                    if (n.lighting) {
                        if (n.lighting.scene) n.lighting.scene = updateLightingLayer(n.lighting.scene);
                        if (n.lighting.conditional_scene) n.lighting.conditional_scene = updateLightingLayer(n.lighting.conditional_scene);
                    }
                    return n;
                });
            }, []);

            const deleteLayer = useCallback((idx) => {
                setConfig(prev => {
                    const n = JSON.parse(JSON.stringify(prev));
                    n.layer.splice(idx, 1);
                   
                    const updateLightingLayer = (rules) => {
                        if (!Array.isArray(rules)) return rules;
                        return rules.filter(r => {
                            const l = typeof r.layer === 'object' ? r.layer.layer : r.layer;
                            return l !== idx;
                        }).map(r => {
                            const l = typeof r.layer === 'object' ? r.layer.layer : r.layer;
                            if (l > idx) {
                                if (typeof r.layer === 'object') r.layer.layer = l - 1; else r.layer = l - 1;
                            }
                            return r;
                        });
                    };
                    if (n.lighting) {
                        if (n.lighting.scene) n.lighting.scene = updateLightingLayer(n.lighting.scene);
                        if (n.lighting.conditional_scene) n.lighting.conditional_scene = updateLightingLayer(n.lighting.conditional_scene);
                    }
                    return n;
                });
            }, []);

            const handleRenameBlockKey = useCallback((blockName, oldKey, newKey) => {
                const count = getUsageCount(config, [oldKey]);
                setConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next[blockName]) return next;
                    next[blockName][newKey] = next[blockName][oldKey]; delete next[blockName][oldKey];
                    if (count > 0) {
                        const regex = new RegExp(`(^|\\W)(${String(oldKey).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                        next.layer?.forEach(l => l.tokens?.forEach(t => { t.text = t.text.replace(regex, `$1${newKey}`); }));
                        ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => {
                            if (next[b]) next[b] = replaceInObj(next[b], [oldKey], newKey);
                        });
                    }
                    return next;
                });
                if (count > 0) alert(`Cascaded rename to ${count} references.`);
            }, [config]);

            const handleDeleteBlockKey = useCallback((blockName, key) => {
                const count = getUsageCount(config, [key]);
                if (count > 0 && !confirm(`⚠️ Used by ${count} references. Deleting will replace them with KC_NO. Proceed?`)) return;
                setConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next[blockName]) return next;
                    delete next[blockName][key]; if (Object.keys(next[blockName]).length === 0) delete next[blockName];
                    if (count > 0) {
                        const regex = new RegExp(`(^|\\W)(${String(key).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                        next.layer?.forEach(l => l.tokens?.forEach(t => { t.text = t.text.replace(regex, `$1KC_NO`); }));
                        ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => {
                            if (next[b]) next[b] = deleteInObj(next[b], [key]);
                        });
                    }
                    return next;
                });
            }, [config]);

            const activeLayerTokens = useMemo(() => config?.layer?.[activeLayer]?.tokens?.map(t => t.text) || [], [config, activeLayer]);
            const baseLayerTokens = useMemo(() => config?.layer?.[0]?.tokens?.map(t => t.text) || [], [config]);
            const findLayerIdxByName = (cfg, pattern) => cfg?.layer?.findIndex(l => pattern.test(l.name || '')) ?? -1;
            const currentLayoutVariant = useMemo(() => {
                const baseIdx = findLayerIdxByName(config, /base/i);
                return detectLayoutVariant(config?.layer?.[baseIdx >= 0 ? baseIdx : 0]);
            }, [config]);
           
            const activeLightingScenes = useMemo(() => {
                if (!config?.lighting) return [];
                const arr = [];
                const parseL = (l) => typeof l === 'object' ? l?.layer : l;
                if (Array.isArray(config.lighting.scene)) config.lighting.scene.forEach(s => { if (parseL(s.layer) === activeLayer || parseL(s.layer) === undefined) arr.push({...s, isCond: false}); });
                if (Array.isArray(config.lighting.conditional_scene)) config.lighting.conditional_scene.forEach(s => { if (parseL(s.layer) === activeLayer || parseL(s.layer) === undefined) arr.push({...s, isCond: true}); });
                return arr;
            }, [config, activeLayer]);

            const handleSwapKeys = useCallback((idx1, idx2) => {
                setConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (view === 'lighting' && next.lighting) {
                        const led1 = MATRIX_TO_LED[idx1];
                        const led2 = MATRIX_TO_LED[idx2];
                        if (led1 !== -1 && led2 !== -1) {
                            const isMatch = (l) => (typeof l === 'object' ? l?.layer : l) === activeLayer || l === undefined;
                            const swapLeds = (arr) => {
                                if (!Array.isArray(arr)) return;
                                arr.forEach(s => { if (isMatch(s.layer) && s.led === led1) s.led = -999; });
                                arr.forEach(s => { if (isMatch(s.layer) && s.led === led2) s.led = led1; });
                                arr.forEach(s => { if (isMatch(s.layer) && s.led === -999) s.led = led2; });
                            };
                            swapLeds(next.lighting.scene);
                            swapLeds(next.lighting.conditional_scene);
                        }
                    } else {
                        const temp = next.layer[activeLayer].tokens[idx1].text;
                        next.layer[activeLayer].tokens[idx1].text = next.layer[activeLayer].tokens[idx2].text;
                        next.layer[activeLayer].tokens[idx2].text = temp;
                    }
                    return next;
                });
            }, [activeLayer, view]);

            if (!engineReady) return <div className="flex items-center justify-center h-full w-full bg-[color:var(--bg-base)]"><p className="animate-pulse font-mono text-sm text-[color:var(--text-muted)]">Booting Ephemeral JSON Engine...</p></div>;

            return (
                <div className="flex h-full w-full font-sans">
                    <div className="panel flex flex-col shrink-0 p-5 gap-6 z-30 shadow-lg transition-colors relative" style={{ width: leftWidth }}>
                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <h1 className="text-xl font-bold flex items-center gap-2">RMK Studio</h1>
                                <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="text-[color:var(--text-muted)] hover:text-[color:var(--accent)] transition-colors bg-[color:var(--bg-base)] p-1.5 rounded-md border border-[color:var(--border-panel)]" title="Toggle Theme">
                                    {theme === 'dark' ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                    : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>}
                                </button>
                            </div>
                            <label className="block mt-4 w-full bg-[color:var(--accent)] hover:brightness-110 text-white text-center py-3 rounded-lg cursor-pointer transition-all text-sm font-bold shadow-md">
                                Load keyboard.toml <input type="file" accept=".toml,.txt" className="hidden" onChange={handleFileUpload} />
                            </label>
                        </div>

                        {config && (
                            <div className="flex-1 flex flex-col gap-6 overflow-hidden">
                                <div className="flex flex-col h-full overflow-hidden">
                                    <h3 className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest mb-3 px-1">Matrix Layers</h3>
                                    <div className="flex flex-col gap-1.5 overflow-y-auto hide-scrollbar flex-1 pr-1">
                                        {config.layer.map((l, i) => (
                                            <div key={i} className={`group flex items-center p-1 rounded-lg transition-all border ${activeLayer === i ? 'bg-[color:var(--accent-soft)] border-[color:var(--accent)]' : 'border-transparent hover:border-[color:var(--border-panel)]'}`}>
                                                <button onClick={() => { setActiveLayer(i); setSelectedKey(null); }} className={`flex-1 text-left px-2 py-2 truncate text-xs font-bold ${activeLayer === i ? 'text-[color:var(--accent)]' : 'text-[color:var(--text-muted)] hover:text-[color:var(--text-main)]'}`}>
                                                    <span className="text-[9px] font-mono opacity-50 mr-2">{i}</span>{l.name || l.id || `Layer ${i}`}
                                                </button>
                                                <div className="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity pr-1">
                                                    <button title="Move Up" onClick={() => { if (i - 1 < 0) return; swapLayers(i, i - 1); setActiveLayer(i - 1); }} className="text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] hover:bg-[color:var(--bg-base)] p-1 rounded text-xs font-mono" disabled={i === 0}>↑</button>
                                                    <button title="Move Down" onClick={() => { if (i + 1 >= config.layer.length) return; swapLayers(i, i + 1); setActiveLayer(i + 1); }} className="text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] hover:bg-[color:var(--bg-base)] p-1 rounded text-xs font-mono" disabled={i === config.layer.length - 1}>↓</button>
                                                    <button title="Rename" onClick={() => { const n = prompt('Rename layer:', l.name || `Layer ${i}`); if(n) { setConfig(prev => { const cfg = JSON.parse(JSON.stringify(prev)); cfg.layer[i].name = n; return cfg; }); } }} className="text-[color:var(--text-muted)] hover:text-[color:var(--accent)] hover:bg-[color:var(--accent-soft)] p-1 rounded text-xs">✎</button>
                                                    <button title="Delete" onClick={() => {
                                                        if(config.layer.length <= 1) return alert("Cannot delete last layer.");
                                                        if(!confirm("Delete layer?")) return;
                                                        const newLength = config.layer.length - 1;
                                                        deleteLayer(i);
                                                        setActiveLayer(prevActive => {
                                                            if (prevActive === i) return Math.min(i, newLength - 1);
                                                            if (prevActive > i) return prevActive - 1;
                                                            return prevActive;
                                                        });
                                                        setSelectedKey(null);
                                                    }} className="text-[color:var(--text-muted)] hover:text-red-500 hover:bg-red-500/10 p-1 rounded text-xs">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
