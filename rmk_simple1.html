                                    <div className="flex gap-2 mt-2">
                                        <button onClick={() => {
                                            setConfig(prev => {
                                                const n = JSON.parse(JSON.stringify(prev));
                                                const b = n.layer[0];
                                                n.layer.push({ name: `Layer ${n.layer.length}`, keys: "", tokens: b.tokens.map(t => ({space: t.space, text: '_______'})), tail: b.tail });
                                                return n;
                                            });
                                            setActiveLayer(config.layer.length);
                                        }} className="flex-1 py-2 text-xs font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)] border border-dashed border-[color:var(--border-panel)] hover:border-[color:var(--accent)] rounded-lg transition-all">
                                            + Layer
                                        </button>
                                        <button onClick={() => {
                                            const targetNames = [/base/i, /typing/i, /autoshift/i];
                                            const targetIdxs = [...new Set(targetNames.map(p => findLayerIdxByName(config, p)).filter(i => i >= 0))];
                                            if (targetIdxs.length === 0) return alert("Couldn't find a Base, Typing, or Autoshift layer by name to convert.");

                                            if (currentLayoutVariant === null) {
                                                if (!confirm("Couldn't detect whether the Base layer is currently QWERTY or Aptmak-Blue (positions 30-32 don't match either signature exactly). Convert QWERTY -> Aptmak-Blue anyway?")) return;
                                            }
                                            const current = currentLayoutVariant || 'qwerty';
                                            const goingTo = current === 'qwerty' ? 'aptmak' : 'qwerty';
                                            const map = current === 'qwerty' ? QWERTY_TO_APTMAK : APTMAK_TO_QWERTY;
                                            const label = goingTo === 'aptmak' ? 'Aptmak-Blue' : 'QWERTY';
                                            const layerNames = targetIdxs.map(i => config.layer[i].name || `Layer ${i}`).join(', ');
                                            if (currentLayoutVariant !== null && !confirm(`Convert letter keys to ${label} on: ${layerNames}?`)) return;
                                            setConfig(prev => {
                                                const n = JSON.parse(JSON.stringify(prev));
                                                targetIdxs.forEach(idx => { n.layer[idx].tokens.forEach(t => t.text = t.text.replace(/\bKC_[A-Z]+\b/g, m => map[m] || m)); });
                                                return n;
                                            });
                                        }} title={currentLayoutVariant === null ? "Couldn't detect current layout from the Base layer's bindings" : `Base layer is currently ${currentLayoutVariant === 'aptmak' ? 'Aptmak-Blue' : 'QWERTY'} — click to convert Base + Typing + Autoshift to ${currentLayoutVariant === 'aptmak' ? 'QWERTY' : 'Aptmak-Blue'}`} className={`flex-1 py-2 text-xs font-bold border border-dashed rounded-lg transition-all ${currentLayoutVariant === 'aptmak' ? 'text-blue-500 border-blue-500' : currentLayoutVariant === null ? 'text-amber-500 border-amber-500/50' : 'text-[color:var(--text-muted)] border-[color:var(--border-panel)] hover:text-blue-500 hover:border-blue-500'}`}>
                                            {currentLayoutVariant === 'aptmak' ? '⌨️ QWERTY' : currentLayoutVariant === null ? '❓ Aptmak' : '✨ Aptmak'}
                                        </button>
                                    </div>
                                </div>
                                <button onClick={handleExport} className="w-full mt-auto bg-emerald-600 hover:brightness-110 text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md shrink-0">Export Layout</button>
                            </div>
                        )}
                    </div>
                   
                    <div className="resizer-v" onPointerDown={startLeftResize}></div>

                    <div className={`flex flex-1 ${dockMode === 'bottom' ? 'flex-col' : 'flex-row'} overflow-hidden relative`}>
                        <div ref={canvasWrapperRef} className="flex-1 relative overflow-hidden z-10 flex items-center justify-center">
                            {!config ? (
                                <div className="flex flex-col items-center gap-10 max-w-2xl text-center">
                                    <div className="text-[color:var(--text-muted)] flex flex-col items-center gap-4">
                                        <svg className="w-12 h-12 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                        <span className="text-sm font-medium">Upload an RMK `keyboard.toml` layout to test the pipeline.</span>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <div ref={toolbarRef} className="absolute top-6 right-6 flex items-center panel border rounded-lg shadow-sm z-40 transition-colors">
                                        <button onClick={undoConfig} disabled={!canUndo} title="Undo (Ctrl+Z)" className="p-2.5 text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] transition-colors disabled:opacity-25 disabled:pointer-events-none"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 15L4 10l5-5M4 10h11a4 4 0 010 8h-1"></path></svg></button>
                                        <button onClick={redoConfig} disabled={!canRedo} title="Redo (Ctrl+Y)" className="p-2.5 text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] transition-colors disabled:opacity-25 disabled:pointer-events-none"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l5-5-5-5M20 10H9a4 4 0 000 8h1"></path></svg></button>
                                        <div className="w-px h-5 bg-[color:var(--border-panel)] mx-1"></div>
                                        <button onClick={() => setScale(s => Math.max(0.3, s - 0.1))} className="p-2.5 text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 12H4"></path></svg></button>
                                        <span className="text-[11px] font-mono font-bold w-12 text-center select-none text-[color:var(--text-main)]">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => setScale(s => Math.min(2.0, s + 0.1))} className="p-2.5 text-[color:var(--text-muted)] hover:text-[color:var(--text-main)] transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg></button>
                                        <div className="w-px h-5 bg-[color:var(--border-panel)] mx-1"></div>
                                        <button onClick={autoFitCanvas} title="Recenter & Auto-Fit View" className="p-2.5 text-[color:var(--accent)] hover:brightness-110 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg></button>
                                        <div className="w-px h-5 bg-[color:var(--border-panel)] mx-1"></div>
                                        <button onClick={() => setShowIndices(s => !s)} title="Show matrix key numbers on every key" className={`px-2.5 py-2 text-[10px] font-mono font-bold transition-colors ${showIndices ? 'text-[color:var(--accent)]' : 'text-[color:var(--text-muted)] hover:text-[color:var(--text-main)]'}`}>#{showIndices ? '✓' : ''}</button>
                                    </div>
                                    <div className="absolute top-6 left-6 flex items-center text-[color:var(--text-muted)] bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] px-4 py-2 rounded-lg shadow-sm z-40 transition-colors text-[11px] font-semibold gap-2 pointer-events-none">
                                        <svg className="w-4 h-4 text-[color:var(--accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                                        Middle-Click & Drag to pan
                                    </div>
                                    <KeyboardContainer layerTokens={activeLayerTokens} baseTokens={baseLayerTokens} selectedKey={selectedKey} onSelectKey={setSelectedKey} scale={scale} pan={pan} isPanning={isPanning} onPanStart={handlePanStart} onPanMove={handlePanMove} onPanEnd={handlePanEnd} onSwap={handleSwapKeys} lightingScenes={activeLightingScenes} isLightingMode={view === 'lighting' || view === 'effects'} showIndices={showIndices} isPaintMode={isPaintMode && view === 'lighting'} onPaintDown={handlePaintDown} onPaintEnter={handlePaintEnter} previewFlashes={previewFlashes} previewFlashDurationMs={previewFlashDurationMs} />
                                </>
                            )}
                        </div>
                       
                        {config && dockMode !== 'hidden' && (
                            <>
                                <div className={dockMode === 'bottom' ? 'resizer-h' : 'resizer-v'} onPointerDown={dockMode === 'bottom' ? startBottomResize : startRightResize}></div>
                                <div style={dockMode === 'bottom' ? { height: bottomHeight } : { width: rightWidth }} className="panel flex flex-col shrink-0 z-30 shadow-2xl transition-colors">
                                    <Inspector view={view} setView={setView} config={config} activeLayer={activeLayer} setActiveLayer={setActiveLayer} selectedKey={selectedKey} setSelectedKey={setSelectedKey} updateConfig={setConfig} tabs={dynamicTabs} handleRenameBlockKey={handleRenameBlockKey} handleDeleteBlockKey={handleDeleteBlockKey} showIndices={showIndices} setShowIndices={setShowIndices} clipboard={clipboard} setClipboard={setClipboard} isDockedBottom={dockMode === 'bottom'} toggleDock={() => setDockMode(d => d === 'right' ? 'bottom' : 'right')} isPaintMode={isPaintMode} setIsPaintMode={setIsPaintMode} paintColor={paintColor} setPaintColor={setPaintColor} isPreviewingEffect={isPreviewingEffect} setIsPreviewingEffect={setIsPreviewingEffect} />
                                </div>
                            </>
                        )}
                       
                        {config && dockMode === 'hidden' && (
                            <div className="absolute right-0 top-1/2 -translate-y-1/2 panel border border-r-0 border-[color:var(--border-panel)] rounded-l-xl shadow-lg z-50">
                                <button onClick={() => setDockMode('right')} className="px-2 py-6 text-[color:var(--text-muted)] hover:text-[color:var(--accent)] flex items-center justify-center">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
