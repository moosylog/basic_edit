        const R_C2 = [11, 25, 39, 53, 67, 81];

        const LED_TO_MATRIX = [
            ...L_THUMBS, ...L_C5, ...L_C4, ...L_C3, ...L_C2, ...L_C0, ...L_C1,
            ...R_THUMBS, ...R_C5, ...R_C4, ...R_C3, ...R_C2, ...R_C0, ...R_C1
        ];
        const MATRIX_TO_LED = new Array(84).fill(-1);
        LED_TO_MATRIX.forEach((matrixIdx, ledIdx) => { MATRIX_TO_LED[matrixIdx] = ledIdx; });

        // QWERTY -> Aptmak-Blue letter/punctuation remap. Verified to be a clean bijection
        // (26 keys, 26 distinct values) so the reverse map below is unambiguous.
        const QWERTY_TO_APTMAK = {'KC_W':'KC_J','KC_E':'KC_U','KC_R':'KC_L','KC_T':'KC_SCLN','KC_Y':'KC_B','KC_U':'KC_P','KC_I':'KC_F','KC_O':'KC_W','KC_P':'KC_X','KC_S':'KC_O','KC_D':'KC_I','KC_F':'KC_N','KC_G':'KC_Y','KC_H':'KC_K','KC_J':'KC_H','KC_K':'KC_T','KC_L':'KC_S','KC_SCLN':'KC_R','KC_X':'KC_DOT','KC_C':'KC_COMM','KC_V':'KC_M','KC_B':'KC_E','KC_N':'KC_V','KC_M':'KC_D','KC_COMM':'KC_G','KC_DOT':'KC_C'};
        const APTMAK_TO_QWERTY = Object.fromEntries(Object.entries(QWERTY_TO_APTMAK).map(([k, v]) => [v, k]));

        // Detects the actual current layout from real key bindings rather than assuming —
        // matrix positions 30-32 are W/E/R in QWERTY vs J/U/L in Aptmak-Blue (position 29,
        // Q, is unchanged by the map so it's not diagnostic on its own).
        const detectLayoutVariant = (layerObj) => {
            if (!layerObj?.tokens) return null;
            const t30 = layerObj.tokens[30]?.text, t31 = layerObj.tokens[31]?.text, t32 = layerObj.tokens[32]?.text;
            if (t30 === 'KC_J' && t31 === 'KC_U' && t32 === 'KC_L') return 'aptmak';
            if (t30 === 'KC_W' && t31 === 'KC_E' && t32 === 'KC_R') return 'qwerty';
            return null; // doesn't match either known signature (custom layout, or layer doesn't use these positions)
        };

        // --- 2. GLOBAL UTILITIES & PARSERS ---
        const getContrastColor = (hexcolor) => {
            if (!hexcolor) return '#f8fafc';
            let cleanHex = String(hexcolor).replace("#", "");
            if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(c => c+c).join('');
            if (cleanHex.length !== 6) return '#fff';
            const r = parseInt(cleanHex.substr(0,2),16), g = parseInt(cleanHex.substr(2,2),16), b = parseInt(cleanHex.substr(4,2),16);
            return (((r*299)+(g*587)+(b*114))/1000 >= 128) ? '#000' : '#fff';
        };

        // Scales the on-key label to its content instead of one fixed size for every key —
        // a lone letter reads much better large; a full word like "Enter" needs to shrink to fit.
        const getKeyFontSize = (text) => {
            if (!text) return 11;
            const lines = text.split('\n');
            const maxLen = Math.max(...lines.map(l => l.length));
            if (lines.length > 1) return maxLen > 6 ? 9 : 10;
            if (maxLen <= 1) return 16;
            if (maxLen <= 2) return 14.5;
            if (maxLen <= 4) return 13;
            if (maxLen <= 6) return 11;
            if (maxLen <= 8) return 10;
            return 9.5;
        };

        const tokenizeKeysString = (keysString) => {
            if (!keysString || typeof keysString !== 'string') return { tokens: [], tail: "" };
            let tokens = []; let i = 0; const len = keysString.length;
            while (i < len) {
                let space = ""; while (i < len && /\s/.test(keysString[i])) { space += keysString[i]; i++; }
                if (i >= len) return { tokens, tail: space };

                let text = ""; let parenDepth = 0;
                while (i < len) {
                    let char = keysString[i];
                    if (char === '(') { parenDepth++; text += char; i++; }
                    else if (char === ')') { if (parenDepth > 0) parenDepth--; text += char; i++; }
                    else if (/\s/.test(char) && parenDepth === 0) { break; }
                    else { text += char; i++; }
                }

            }

        const untokenizeKeys = (layerObj) => {
            if (!layerObj.tokens) return layerObj.keys || "";
            return layerObj.tokens.map(t => t.space + t.text).join('') + (layerObj.tail || "");

        // Runs right after a TOML file is parsed. Repairs what's safe to repair automatically

        // what it can't safely guess a fix for (like a malformed keys grid).
        const validateAndRepairConfig = (parsed) => {
            const issues = [];
            const maxLed = LED_TO_MATRIX.length - 1;
            const numLayers = Array.isArray(parsed.layer) ? parsed.layer.length : 0;

            (parsed.layer || []).forEach((l, i) => {
                if (typeof l.keys === 'string' && l.keys.trim().length > 0) {
                    const count = l.tokens ? l.tokens.length : 0;
                    if (count !== 84) {
                        issues.push(`Layer ${i} ("${l.name || l.id || i}") has ${count} keys instead of 84 — its keys grid looks malformed. This layer was NOT auto-corrected; please check it manually.`);
                    }
                }
            });

                const fixRules = (rules, label, dedupe) => {
                    if (!Array.isArray(rules)) return rules;
                    const seen = new Set();
                    const cleaned = [];
                    for (let i = rules.length - 1; i >= 0; i--) {
                        const r = rules[i];
                        const layerNum = typeof r.layer === 'object' ? r.layer?.layer : r.layer;

                        if (r.led === undefined || r.led === null || isNaN(r.led) || r.led < 0 || r.led > maxLed) {
                            issues.push(`Removed a ${label} rule with an invalid LED index (${r.led}).`);
                            continue;
                        }
                        if (layerNum !== undefined && (layerNum < 0 || layerNum >= numLayers)) {
                            issues.push(`Removed a ${label} rule pointing at layer ${layerNum}, which doesn't exist (this file only has ${numLayers} layers).`);
                            continue;
                        }
                        if (dedupe) {
                            const dedupeKey = `${r.led}:${layerNum}`;
                            if (seen.has(dedupeKey)) {
                                issues.push(`Removed a duplicate static color rule for LED ${r.led} on layer ${layerNum ?? 'all'} (kept the last one, since that's the one that actually renders).`);
                                continue;
                            }
                            seen.add(dedupeKey);
                        }
                        if (!r.effect) r.effect = 'solid';
                        cleaned.unshift(r);
                    }

                    issues.push(`Corrected output_mode from the invalid "auto-off" (a bug in an earlier version of this tool) to "always-off".`);

            const modComboMatch = binding.match(/^MOD\(([^)]+)\)$/);
            if (modComboMatch) {
                const initials = { LCTL: 'C', LALT: 'A', LGUI: 'G', LSFT: 'S', RCTL: 'C', RALT: 'A', RGUI: 'G', RSFT: 'S' };
                const parts = modComboMatch[1].split('|').map(p => initials[p.replace('MOD_', '').trim()] || '?');
                return parts.join('+');
            }
            return formatKeycode(binding);
        };

        // --- 3. RECURSIVE VISUAL PROPERTY EDITOR ---
        const EditableKeyName = ({ initialName, onRename }) => {
            const [val, setVal] = useState(initialName);
            const [isEditing, setIsEditing] = useState(false);
            const handleCommit = () => { setIsEditing(false); const clean = val.trim(); if(clean && clean !== initialName) onRename(clean); else setVal(initialName); };
            if (!isEditing) return <span onDoubleClick={() => setIsEditing(true)} title="Double-click to rename" className="text-[11px] font-bold text-[color:var(--text-main)] font-mono truncate mr-2 cursor-text hover:text-[color:var(--accent)] transition-colors">{val}</span>;
            return <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={handleCommit} onKeyDown={e => e.key === 'Enter' && handleCommit()} className="bg-transparent font-mono text-[11px] font-bold outline-none text-[color:var(--accent)] border-b border-[color:var(--accent)] w-full max-w-[120px] mr-2" />;
        };

        const StructuredNode = memo(({ value, onChange, depth }) => {
            const type = Array.isArray(value) ? 'array' : value === null ? 'null' : typeof value;
            if (type === 'string') return <input type="text" className="input-field font-mono text-xs py-1.5 !text-[color:var(--accent)] shadow-inner" value={value} onChange={e => onChange(e.target.value)} />;
            if (type === 'number') return <input type="number" className="input-field font-mono text-xs py-1.5 !text-[color:var(--accent)] shadow-inner" value={value} onChange={e => onChange(Number(e.target.value))} />;
            if (type === 'boolean') return <label className="relative inline-flex items-center cursor-pointer mt-1"><input type="checkbox" className="sr-only peer" checked={value} onChange={e => onChange(e.target.checked)} /><div className="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-[color:var(--accent)] shadow-inner"></div></label>;
            if (type === 'array' || type === 'object') return <ObjectEditor obj={value} onChange={onChange} depth={depth} />;
            return null;
        });

        const ObjectEditor = memo(({ obj, onChange, onRenameKey, onRemoveKey, depth = 0 }) => {
            const isArr = Array.isArray(obj);
            const [newKey, setNewKey] = useState('');
            const [newType, setNewType] = useState('string');
            return (
                <div className="flex flex-col gap-2 w-full">
                    {Object.entries(obj).map(([k, v]) => (
                        <div key={k} className="flex flex-col gap-1 p-3 bg-[color:var(--bg-base)] border border-[color:var(--border-panel)] rounded-xl relative group transition-all">
                            <div className="flex justify-between items-center mb-1">
                                { depth === 0 && onRenameKey && !isArr ? <EditableKeyName initialName={k} onRename={(newK) => onRenameKey(k, newK)} /> : <label className="text-[11px] font-bold text-[color:var(--text-main)] font-mono">{k}</label> }
                                <button onClick={() => { if(depth === 0 && onRemoveKey && !isArr) onRemoveKey(k); else { const next = isArr ? [...obj] : {...obj}; if(isArr) next.splice(k, 1); else delete next[k]; onChange(next); } }} className="text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition-opacity font-bold hover:bg-red-500/10 px-2 py-0.5 rounded">Remove</button>
                            </div>
                            <StructuredNode value={v} depth={depth+1} onChange={(newVal) => { const next = isArr ? [...obj] : {...obj}; next[k] = newVal; onChange(next); }} />
                        </div>
                    ))}
                    <div className="flex gap-2 items-center mt-1 p-2 border border-dashed border-[color:var(--border-panel)] rounded-xl">
                        {!isArr && <input type="text" value={newKey} onChange={e => setNewKey(e.target.value)} placeholder="New property..." className="input-field text-xs py-1.5 flex-1" />}
                        <select value={newType} onChange={e => setNewType(e.target.value)} className="input-field text-xs py-1.5 w-auto pr-8">
                            <option value="string">Text</option>
                            <option value="number">Num</option>
                            <option value="boolean">Bool</option>
                            <option value="object">Table</option>
                            <option value="array">List</option>
                        </select>
                        <button onClick={() => {
                            const key = isArr ? obj.length : newKey.trim();
                            if(!isArr && !key) return;
                            let emptyVal = newType==='string'?"":newType==='number'?0:newType==='boolean'?false:newType==='object'?{}:[];
                            onChange(isArr ? [...obj, emptyVal] : {...obj, [key]: emptyVal});
                            setNewKey(''); setNewType('string');
                        }} className="bg-[color:var(--bg-panel)] text-[color:var(--text-main)] border border-[color:var(--border-panel)] hover:bg-[color:var(--accent)] hover:text-white px-3 py-1.5 rounded-md text-xs font-bold transition-all shrink-0">Add</button>
                    </div>
                </div>
            );
        });

// --- 4. DEPENDENCY GRAPH ENGINE ---
        const getImplicitIds = (blockName, idx) => {
            if (blockName === 'morse' || blockName === 'tap_dance') return [`TD(${idx})`, `TD${idx}`];
            if (blockName === 'macro') return [`MACRO(${idx})`, `MC(${idx})`, `MC${idx}`];
            return [];
        };

        const getIdentifiersForBlock = (config, block, key, item, idx) => {
            const ids = new Set();
            if (item && item.name && typeof item.name === 'string') { ids.add(item.name); ids.add(`&${item.name}`); }
            if (item && item.id && typeof item.id === 'string') { ids.add(item.id); }
            if (key) ids.add(key);
            const implicit = getImplicitIds(block, idx);
            implicit.forEach(id => ids.add(id));
            return Array.from(ids);
        };

        const getDefinedBehaviors = (cfg) => {
            const found = [];
            const processArray = (arr, block) => {
                if (!Array.isArray(arr)) return;
                arr.forEach((item, idx) => {
                    const ids = getIdentifiersForBlock(cfg, block, null, item, idx);
                    if (ids.length) found.push({ block, label: item.name || ids[0], ids });
                });
            };
            const processObj = (obj, block) => {
                if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return;
                Object.entries(obj).forEach(([k, v]) => { found.push({ block, label: k, ids: [k, `&${k}`] }); });
            };

            processArray(cfg.macro, 'macro'); processArray(cfg.combo, 'combo');
            processArray(cfg.morse, 'morse'); processArray(cfg.tap_dance, 'tap_dance');
            processArray(cfg.mod_morph, 'mod_morph');

            if (cfg.behavior) {
                ['morse', 'tap_dance', 'mod_morph', 'macro'].forEach(type => {
                    if (cfg.behavior[type]?.profiles) processObj(cfg.behavior[type].profiles, `behavior.${type}.profiles`);
                });
            }
            return found;
        };

        const getUsageCount = (config, identifiers) => {
            if (!config || !identifiers || !Array.isArray(identifiers) || identifiers.length === 0) return 0;
            const regexes = identifiers.filter(Boolean).map(id => {
                const escaped = String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                return new RegExp(`(?:^|[^a-zA-Z0-9_])${escaped}(?:$|[^a-zA-Z0-9_])`);
            });
            if (regexes.length === 0) return 0;

            let count = 0;
            const check = (str) => {
                if (typeof str !== 'string' || !str) return;
                for (let rx of regexes) { if (rx.test(str)) { count++; break; } }
            };

            if (Array.isArray(config.layer)) {
                config.layer.forEach(l => {
                    if (Array.isArray(l.tokens)) { l.tokens.forEach(t => { if (t && t.text) check(t.text); }); }
                    else if (typeof l.keys === 'string') { l.keys.trim().split(/\s+/).forEach(check); }
                });
            }

            const walk = (obj, keyName) => {
                if (!obj) return;
                if (typeof obj === 'string') { if (keyName !== 'name' && keyName !== 'id') check(obj); }
                else if (Array.isArray(obj)) { obj.forEach(v => walk(v, keyName)); }
                else if (typeof obj === 'object') { Object.entries(obj).forEach(([k, v]) => walk(v, k)); }
            };

            ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => { if (config[b]) walk(config[b], b); });
            return count;
        };

        const getCategory = (text, config) => {
            if (!text) return 'Unknown';
            if(text.startsWith('LT') || text.startsWith('MT') || text.startsWith('TH')) return 'Dual-Role';
            if(text.startsWith('MO') || text.startsWith('TO') || text.startsWith('TG')) return 'Layer Switch';
            if(text.startsWith('LSFT') || text.startsWith('LCTL') || text.startsWith('LALT') || text.startsWith('LGUI') || text.startsWith('OSM')) return 'Modifiers';
            if(text.startsWith('KC_')) return 'Keycode';
            if(text === '--' || text === 'KC_NO' || text === '_______' || text === 'KC_TRNS') return 'System / Trans';
            if(text.startsWith('MACRO')) return 'Macros';
            if(text.startsWith('TD')) return 'Tap Dances';
            return 'Custom Behaviors';
        };

        const replaceInObj = (obj, oldIds, newId) => {
            if (!obj) return obj;
            if (typeof obj === 'string') {
                let res = obj;
                oldIds.forEach(id => {
                    const regex = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                    res = res.replace(regex, `$1${newId}`);
                });
                return res;
            } else if (Array.isArray(obj)) return obj.map(v => replaceInObj(v, oldIds, newId));
            else if (typeof obj === 'object') {
                const next = {};
                Object.entries(obj).forEach(([k, v]) => { if (k === 'name' || k === 'id') next[k] = v; else next[k] = replaceInObj(v, oldIds, newId); });
                return next;
            }
            return obj;
        };

        const deleteInObj = (obj, oldIds) => {
            if (!obj) return obj;
            if (typeof obj === 'string') {
                let res = obj;
                oldIds.forEach(id => {
                    const regex = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                    res = res.replace(regex, `$1KC_NO`);
                });
                return res;
            } else if (Array.isArray(obj)) return obj.map(v => deleteInObj(v, oldIds));
            else if (typeof obj === 'object') {
                const next = {};
                Object.entries(obj).forEach(([k, v]) => { if (k === 'name' || k === 'id') next[k] = v; else next[k] = deleteInObj(v, oldIds); });
                return next;
            }
            return obj;
        };

        // --- 5. SMART LIGHTING DASHBOARDS ---
        // Slider + numeric readout, clamped and NaN-guarded (same pattern used for the brightness fix)
        const SliderField = ({ label, value, onChange, min = 0, max = 255 }) => {
            const safeVal = Number.isFinite(value) ? value : min;
            const clamp = (v) => Math.max(min, Math.min(max, v));
            return (
                <div className="flex items-center gap-2 mb-2">
                    <span className="text-[10px] text-[color:var(--text-muted)] w-20 shrink-0">{label}</span>
                    <input type="range" min={min} max={max} value={safeVal} onChange={e => onChange(clamp(parseInt(e.target.value, 10)))} className="flex-1 accent-[color:var(--accent)] cursor-pointer h-1" />
                    <input type="number" min={min} max={max} value={safeVal} onChange={e => { const v = parseInt(e.target.value, 10); onChange(Number.isNaN(v) ? min : clamp(v)); }} className="input-field w-14 py-1 px-1.5 text-[10px] font-mono text-center shrink-0" />
                </div>
            );
        };

        // Dropdown seeded with known values (from real sample data) + a "Custom…" escape hatch,
        // so we never silently drop a firmware value we don't recognize.
        const EnumField = ({ label, value, onChange, knownOptions }) => {
            const [customMode, setCustomMode] = useState(!!value && !knownOptions.includes(value));
            return (
                <div className="flex items-center gap-2 mb-2">
                    {label && <span className="text-[10px] text-[color:var(--text-muted)] w-20 shrink-0">{label}</span>}
                    {customMode ? (
                        <input autoFocus type="text" value={value ?? ''} onChange={e => onChange(e.target.value)} placeholder={label ? `Custom ${label.toLowerCase()}` : 'Custom value'} className="input-field flex-1 py-1 px-2 text-xs font-mono" />
                    ) : (
                        <select value={value ?? ''} onChange={e => { if (e.target.value === '__custom__') setCustomMode(true); else onChange(e.target.value); }} className="input-field flex-1 py-1 px-2 text-xs">
                            {value && !knownOptions.includes(value) && <option value={value}>{value}</option>}
                            {knownOptions.map(o => <option key={o} value={o}>{o}</option>)}
                            <option value="__custom__">Custom…</option>
                        </select>
                    )}
                    {customMode && <button type="button" onClick={() => setCustomMode(false)} title="Back to list" className="text-[10px] text-[color:var(--text-muted)] hover:text-[color:var(--accent)] shrink-0">↩</button>}
                </div>
            );
        };

        // h/s/v assumed on the same 0-255 scale as the existing Brightness field, for consistency
        const hsvToHex = (h, s, v) => {
            const hh = ((h ?? 0) / 255) * 360, ss = (s ?? 0) / 255, vv = (v ?? 0) / 255;
            const c = vv * ss, x = c * (1 - Math.abs(((hh / 60) % 2) - 1)), m = vv - c;
            let r = 0, g = 0, b = 0;
            if (hh < 60) { r = c; g = x; } else if (hh < 120) { r = x; g = c; } else if (hh < 180) { g = c; b = x; }
            else if (hh < 240) { g = x; b = c; } else if (hh < 300) { r = x; b = c; } else { r = c; b = x; }
            const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        };

        // Diagnostic export: a smooth hue sweep across every LED (LED 0 = red, progressing
        // through the spectrum) so a person can flash it to real hardware and immediately spot
        // any key whose color doesn't fit its expected place in the sequence. Never touches the
        // live editing session — this builds a completely separate config to download.
        const generateLedTestPatternConfig = (liveConfig) => {
            const next = JSON.parse(JSON.stringify(liveConfig));
            next.lighting = next.lighting || {};
            next.lighting.brightness = 255;
            next.lighting.output_mode = 'always-on';
            if (next.lighting.background) next.lighting.background.enabled = false;
            delete next.lighting.conditional_scene; // avoid any override interfering with a clean read
            const totalLeds = LED_TO_MATRIX.length;
            next.lighting.scene = [];
            for (let led = 0; led < totalLeds; led++) {
                const hue = Math.round((led / totalLeds) * 255);
                next.lighting.scene.push({ led, color: hsvToHex(hue, 255, 255), effect: 'solid' }); // no `layer` field = shows on every layer
            }
            return next;
        };

        const LightingDashboard = ({ config, activeLayer, showIndices, setShowIndices, updateConfig, isPaintMode, setIsPaintMode, paintColor, setPaintColor, pendingGuidedAction, setPendingGuidedAction, setSelectedKey }) => {
            const handleDownloadLedTestPattern = () => {
                try {
                    const testConfig = generateLedTestPatternConfig(config);
                    testConfig.layer.forEach(l => { l.keys = untokenizeKeys(l); delete l.tokens; delete l.tail; });
                    const tomlString = window.smolToml.stringify(testConfig);
                    window.smolToml.parse(tomlString); // sanity check before handing over the file
                    const a = document.createElement('a');
                    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(tomlString);
                    a.download = "led-test-pattern.toml";
                    a.click();
                } catch (err) {
                    alert("Couldn't generate the test pattern: " + err.message);
                }
            };

            const handleClearAll = () => {
                if(!confirm(`Clear ALL lighting rules mapped to ${getLayerLabel(config, activeLayer)}?`)) return;
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (next.lighting) {
                        if (Array.isArray(next.lighting.scene)) {
                            next.lighting.scene = next.lighting.scene.filter(s => s.layer !== activeLayer);
                            if (next.lighting.scene.length === 0) delete next.lighting.scene;
                        }
                        if (Array.isArray(next.lighting.conditional_scene)) {
                            next.lighting.conditional_scene = next.lighting.conditional_scene.filter(s => {
                                const l = typeof s.layer === 'object' ? s.layer?.layer : s.layer;
                                return l !== activeLayer;
                            });
                            if (next.lighting.conditional_scene.length === 0) delete next.lighting.conditional_scene;
                        }
                    }
                    return next;
                });
            };

            const updateGlobalLighting = (field, val) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next.lighting) next.lighting = {};
                    next.lighting[field] = val;
                    return next;
                });
            };

            const updateBackground = (field, val) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next.lighting) next.lighting = {};
                    if (!next.lighting.background) next.lighting.background = {};
                    next.lighting.background[field] = val;
                    return next;
                });
            };

            const bg = config?.lighting?.background || {};

            return (
                <div className="flex flex-col gap-4 w-full h-full">
                    <div className="flex justify-between items-center px-2 border-b border-[color:var(--border-panel)] pb-3 gap-2 flex-wrap">
                        <h4 className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest">Global Lighting & Explorer</h4>
                        <div className="flex items-center gap-2">
                            <label className={`flex items-center gap-2 cursor-pointer px-2 py-1 rounded-md border transition-colors ${isPaintMode ? 'bg-[color:var(--accent-soft)] border-[color:var(--accent)]' : 'bg-[color:var(--bg-base)] border-[color:var(--border-panel)]'}`}>
                                <span className="text-[10px] font-bold text-[color:var(--text-main)]">🖌️ Paint Mode</span>
                                <input type="checkbox" checked={isPaintMode} onChange={e => setIsPaintMode(e.target.checked)} className="accent-[color:var(--accent)] cursor-pointer w-3 h-3" />
                            </label>
                            {isPaintMode && (
                                <label className="flex items-center gap-1.5 cursor-pointer bg-[color:var(--bg-base)] px-2 py-1 rounded-md border border-[color:var(--border-panel)]" title="Paint color">
                                    <input type="color" value={paintColor} onChange={e => setPaintColor(e.target.value)} className="w-5 h-5 rounded cursor-pointer border-0 bg-transparent p-0" />
                                </label>
                            )}
                            <label className="flex items-center gap-2 cursor-pointer bg-[color:var(--bg-base)] px-2 py-1 rounded-md border border-[color:var(--border-panel)]">
                                <span className="text-[10px] font-bold text-[color:var(--text-main)]">Show Matrix/LED Indices</span>
                                <input type="checkbox" checked={showIndices} onChange={e => setShowIndices(e.target.checked)} className="accent-[color:var(--accent)] cursor-pointer w-3 h-3" />
                            </label>
                        </div>
                    </div>
                    {isPaintMode && (
                        <div className="mx-2 -mt-2 px-3 py-2 bg-[color:var(--accent-soft)] border border-[color:var(--accent)] rounded-lg text-[10px] text-[color:var(--text-main)] font-medium">
                            Click or drag across keys on the canvas to paint them with the selected color on {getLayerLabel(config, activeLayer)}.
                        </div>
                    )}

                    <div className="mx-2 p-3 bg-[color:var(--bg-panel)] border border-dashed border-[color:var(--border-panel)] rounded-xl">
                        <div className="flex items-center justify-between gap-3 flex-wrap">
                            <div>
                                <span className="text-[10px] font-bold text-[color:var(--text-main)]">🔬 LED Test Pattern</span>
                                <p className="text-[9px] text-[color:var(--text-muted)] mt-0.5">Downloads a separate file — every LED gets a distinct color in a smooth sweep (LED 0 = red, progressing through the spectrum). Flash it to your real keyboard to spot any key whose color doesn't fit its place in the sequence. Doesn't touch your current work.</p>
                            </div>
                            <button onClick={handleDownloadLedTestPattern} className="shrink-0 bg-[color:var(--accent-soft)] border border-[color:var(--accent)] text-[color:var(--accent)] hover:brightness-110 font-bold text-[10px] px-3 py-2 rounded-lg transition-all">⬇ Download Test Pattern</button>
                        </div>
                    </div>
                   
                    <div className="flex flex-col gap-3">
                        <div className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-3 shadow-sm">
                            <h4 className="text-[10px] font-bold text-[color:var(--text-main)] mb-2">Global Settings</h4>
                            <div className="flex gap-2 items-center mb-3">
                                <span className="text-xs text-[color:var(--text-muted)] w-24">Brightness</span>
                                <input type="number" min="0" max="255" value={config?.lighting?.brightness ?? 255} onChange={e => { const v = parseInt(e.target.value, 10); updateGlobalLighting('brightness', Number.isNaN(v) ? 0 : v); }} className="input-field py-1 px-2 text-xs flex-1 font-mono text-[color:var(--accent)]" />
                            </div>
                            <div className="flex gap-2 items-center">
                                <span className="text-xs text-[color:var(--text-muted)] w-24">Output Mode</span>
                                <select value={config?.lighting?.output_mode ?? 'always-on'} onChange={e => updateGlobalLighting('output_mode', e.target.value)} className="input-field py-1 px-2 text-xs flex-1">
                                    <option value="always-on">Always On</option>
                                    <option value="always-off">Always Off</option>
                                    <option value="powered-only">Powered Only (USB)</option>
                                </select>
                            </div>
                        </div>

                        <div className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-3 shadow-sm">
                            <h4 className="text-[10px] font-bold text-[color:var(--text-main)] mb-1">Background (Idle Glow)</h4>
                            <p className="text-[9px] text-[color:var(--text-muted)] italic mb-3">Hue/Saturation/Value/Speed use the same 0–255 scale as Brightness above. Looking for effects? That's now its own tab.</p>

                            <div className="flex items-center justify-between mb-2">
                                <span className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-wide">Enable Background Glow</span>
                                <label className="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" checked={!!bg.enabled} onChange={e => updateBackground('enabled', e.target.checked)} className="accent-[color:var(--accent)] cursor-pointer w-3 h-3" />
                                </label>
                            </div>
                            {bg.enabled && (
                                <div className="pl-0.5">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="w-6 h-6 rounded-full border border-[color:var(--border-panel)] shrink-0 shadow-inner" style={{ backgroundColor: hsvToHex(bg.hue, bg.saturation, bg.value) }} title="Live preview" />
                                        <span className="text-[9px] text-[color:var(--text-muted)] italic">Live color preview</span>
                                    </div>
                                    <SliderField label="Hue" value={bg.hue} onChange={v => updateBackground('hue', v)} />
                                    <SliderField label="Saturation" value={bg.saturation} onChange={v => updateBackground('saturation', v)} />
                                    <SliderField label="Value" value={bg.value} onChange={v => updateBackground('value', v)} />
                                    <SliderField label="Speed" value={bg.speed} onChange={v => updateBackground('speed', v)} />
                                    <EnumField label="Mode" value={bg.mode ?? 'solid'} onChange={v => updateBackground('mode', v)} knownOptions={['solid']} />
                                </div>
                            )}
                        </div>
                    </div>

                    {pendingGuidedAction ? (
                        <div className="flex flex-col items-center justify-center p-6 bg-[color:var(--accent-soft)] border border-[color:var(--accent)] rounded-xl shadow-inner text-center mt-2 animate-pulse">
                            <span className="text-3xl mb-2">👆</span>
                            <span className="text-sm font-bold text-[color:var(--text-main)] mb-1">Now click the key on the canvas you want to use</span>
                            <span className="text-[11px] text-[color:var(--text-muted)] leading-relaxed max-w-xs">Setting up: {pendingGuidedAction === 'usb' ? '🔌 USB Indicator' : pendingGuidedAction === 'ble' ? '📶 BLE Indicator' : '🔋 Battery Indicator'}</span>
                            <button onClick={() => setPendingGuidedAction(null)} className="mt-3 text-[10px] font-bold text-[color:var(--text-muted)] hover:text-[color:var(--accent)]">Cancel</button>
                        </div>
                    ) : (
                        <div className="flex flex-col gap-2 mt-2">
                            <span className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest px-1">Get Started</span>
                            <button onClick={() => setIsPaintMode(true)} className="flex items-center gap-3 p-3 bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm text-left hover:border-[color:var(--accent)] transition-all group">
                                <span className="text-2xl">🖌️</span>
                                <div className="flex-1 min-w-0">
                                    <div className="text-xs font-bold text-[color:var(--text-main)] group-hover:text-[color:var(--accent)]">Start Painting</div>
                                    <div className="text-[10px] text-[color:var(--text-muted)]">Click or drag across keys to color them</div>
                                </div>
                            </button>
                            <button onClick={() => setPendingGuidedAction('usb')} className="flex items-center gap-3 p-3 bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm text-left hover:border-[color:var(--accent)] transition-all group">
                                <span className="text-2xl">🔌</span>
                                <div className="flex-1 min-w-0">
                                    <div className="text-xs font-bold text-[color:var(--text-main)] group-hover:text-[color:var(--accent)]">Set Up a USB Indicator</div>
                                    <div className="text-[10px] text-[color:var(--text-muted)]">Pick a key, then add its connection-status rule</div>
                                </div>
                            </button>
                            <button onClick={() => setPendingGuidedAction('ble')} className="flex items-center gap-3 p-3 bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm text-left hover:border-[color:var(--accent)] transition-all group">
                                <span className="text-2xl">📶</span>
                                <div className="flex-1 min-w-0">
                                    <div className="text-xs font-bold text-[color:var(--text-main)] group-hover:text-[color:var(--accent)]">Set Up a BLE Indicator</div>
                                    <div className="text-[10px] text-[color:var(--text-muted)]">Pick a key, then add its BLE-profile status rule</div>
                                </div>
                            </button>
                            <button onClick={() => setPendingGuidedAction('battery')} className="flex items-center gap-3 p-3 bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm text-left hover:border-[color:var(--accent)] transition-all group">
                                <span className="text-2xl">🔋</span>
                                <div className="flex-1 min-w-0">
                                    <div className="text-xs font-bold text-[color:var(--text-main)] group-hover:text-[color:var(--accent)]">Add a Battery Indicator</div>
                                    <div className="text-[10px] text-[color:var(--text-muted)]">Pick a key, then add its battery-level rule</div>
                                </div>
                            </button>
                            <span className="text-[9px] text-[color:var(--text-muted)] italic px-1 mt-1">Or click any key on the canvas directly to edit its rules manually.</span>
                        </div>
                    )}

                    {config?.lighting && (
                        <div className="p-1 mt-auto shrink-0">
                            <button onClick={handleClearAll} className="w-full bg-red-50 dark:bg-red-950/20 text-red-500 border border-red-200 dark:border-red-900/30 font-bold py-3 rounded-xl transition-colors text-xs hover:bg-red-100 dark:hover:bg-red-900/40 shadow-sm">✕ Clear All Lights on {getLayerLabel(config, activeLayer)}</button>
                        </div>
                    )}
                </div>
            );
        };

        // Timing controls for the "blink" effect — period/phase/duty, as seen in real configs
        const BlinkTimingFields = ({ s, onUpdate }) => (
            <div className="flex items-center gap-2 bg-[color:var(--bg-base)] p-1.5 rounded border border-[color:var(--border-panel)] flex-wrap">
                <span className="text-[9px] font-bold text-[color:var(--text-muted)]">Period(ms)</span>
                <input type="number" min="0" value={s.period_ms ?? 800} onChange={e => { const v = parseInt(e.target.value, 10); onUpdate('period_ms', Number.isNaN(v) ? 800 : v); }} className="input-field py-1 px-2 text-[10px] w-16 font-mono text-center" />
                <span className="text-[9px] font-bold text-[color:var(--text-muted)]">Phase(ms)</span>
                <input type="number" min="0" value={s.phase_ms ?? 0} onChange={e => { const v = parseInt(e.target.value, 10); onUpdate('phase_ms', Number.isNaN(v) ? 0 : v); }} className="input-field py-1 px-2 text-[10px] w-16 font-mono text-center" />
                <span className="text-[9px] font-bold text-[color:var(--text-muted)]">Duty %</span>
                <input type="number" min="0" max="100" value={s.duty ?? 50} onChange={e => { const v = parseInt(e.target.value, 10); onUpdate('duty', Number.isNaN(v) ? 50 : v); }} className="input-field py-1 px-2 text-[10px] w-14 font-mono text-center" />
            </div>
        );

        const KeyLightingEditor = ({ config, updateConfig, activeLayer, selectedKey, setSelectedKey, pendingGuidedAction, setPendingGuidedAction }) => {
            const [newRuleType, setNewRuleType] = useState(pendingGuidedAction || 'base');
            useEffect(() => { setNewRuleType(pendingGuidedAction || 'base'); }, [selectedKey, activeLayer]);
            const ledIndex = selectedKey !== null ? MATRIX_TO_LED[selectedKey] : -1;

            if (ledIndex === -1) {
                return (
                    <div className="flex flex-col items-center justify-center p-8 bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl shadow-sm text-center m-2 h-full">
                        <span className="text-4xl mb-3">⚠️</span>
                        <span className="text-sm font-bold text-[color:var(--text-main)] mb-2">No Physical LED</span>
                        <span className="text-[11px] text-[color:var(--text-muted)] leading-relaxed">Matrix Index {selectedKey} does not map to a physical LED on the Glove80 wiring path.</span>
                        <button onClick={() => setSelectedKey(null)} className="mt-4 px-4 py-2 bg-[color:var(--bg-base)] text-[color:var(--text-main)] rounded-lg text-[10px] font-bold border border-[color:var(--border-panel)] shadow-sm hover:text-[color:var(--accent)] transition-colors">Go Back</button>
                    </div>
                );
            }

            const staticScenes = (config.lighting?.scene || []).map((s, i) => ({ ...s, _globalIdx: i })).filter(s => s.led === ledIndex && (s.layer === activeLayer || s.layer === undefined));
            const condScenes = (config.lighting?.conditional_scene || []).map((s, i) => ({ ...s, _globalIdx: i })).filter(s => s.led === ledIndex && ((typeof s.layer === 'object' ? s.layer?.layer : s.layer) === activeLayer || s.layer === undefined));

            const updateStatic = (globalIdx, field, val) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next.lighting.scene[globalIdx][field] = val;
                    return next;
                });
            };

            const updateCond = (globalIdx, field, val, subfield = null) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (subfield) {
                        if (!next.lighting.conditional_scene[globalIdx][field]) next.lighting.conditional_scene[globalIdx][field] = {};
                        next.lighting.conditional_scene[globalIdx][field][subfield] = val;
                    } else {
                        next.lighting.conditional_scene[globalIdx][field] = val;
                    }
                    return next;
                });
            };

            const hasBaseRule = staticScenes.length > 0;

            const addRule = (type) => {
                if (type === 'base' && hasBaseRule) return; // already has a base color rule for this key+layer — editing that one, not stacking a second
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (!next.lighting) next.lighting = {};

                    if (type === 'base') {
                        if (!next.lighting.scene) next.lighting.scene = [];
                        // Re-check inside the updater in case another add landed between render and click
                        const alreadyHasBase = next.lighting.scene.some(s => s.led === ledIndex && (s.layer === activeLayer || s.layer === undefined));
                        if (alreadyHasBase) return next;
                        next.lighting.scene.push({ layer: activeLayer, led: ledIndex, color: "#0050ff", effect: "solid" });
                    } else {
                        if (!next.lighting.conditional_scene) next.lighting.conditional_scene = [];
                        const newRule = { led: ledIndex, color: "#ea700d", effect: "solid", layer: { layer: activeLayer, active: true } };

                        if (type === 'battery') newRule.battery = { node: 0, min_level: 20, max_level: 100 };
                        if (type === 'usb') newRule.connection = { usb_connected: true };
                        if (type === 'ble') newRule.connection = { profile: 0, ble_state: "connected" };
                        if (type === 'caps') newRule.caps_lock = true;
                        if (type === 'num') newRule.num_lock = true;
                        if (type === 'scroll') newRule.scroll_lock = true;
                        if (type === 'effects_enabled') newRule.effects = { enabled: true };
                        if (type === 'layer_active') { /* layer object is already set above */ }

                        next.lighting.conditional_scene.push(newRule);
                    }
                    return next;
                });
                if (pendingGuidedAction && pendingGuidedAction === type) setPendingGuidedAction(null);
            };

            const deleteStatic = (globalIdx) => {
                if(!confirm("Delete this rule?")) return;
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next.lighting.scene.splice(globalIdx, 1);
                    if(next.lighting.scene.length === 0) delete next.lighting.scene;
                    return next;
                });
            };

            const deleteCond = (globalIdx) => {
                if(!confirm("Delete this rule?")) return;
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next.lighting.conditional_scene.splice(globalIdx, 1);
                    if(next.lighting.conditional_scene.length === 0) delete next.lighting.conditional_scene;
                    return next;
                });
            };

            const moveCondRule = (globalIdxA, globalIdxB) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    const arr = next.lighting.conditional_scene;
                    const temp = arr[globalIdxA];
                    arr[globalIdxA] = arr[globalIdxB];
                    arr[globalIdxB] = temp;
                    return next;
                });
            };

            return (
                <div className="flex flex-col gap-4 w-full p-2 h-full">
                    <div className="flex justify-between items-center border-b border-[color:var(--border-panel)] pb-3 px-1 shrink-0">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setSelectedKey(null)} className="text-[color:var(--text-muted)] hover:text-[color:var(--accent)] p-1.5 rounded-full bg-[color:var(--bg-base)] border border-[color:var(--border-panel)] transition-colors">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <div className="flex flex-col">
                                <span className="text-[12px] font-bold text-[color:var(--text-main)] flex items-center gap-2">💡 LED Index: {ledIndex}</span>
                                <span className="text-[9px] font-mono text-[color:var(--text-muted)]">Matrix Key {selectedKey} | {getLayerLabel(config, activeLayer)}</span>
                            </div>
                        </div>
                    </div>

                    {pendingGuidedAction && (
                        <div className="flex items-center gap-2 bg-[color:var(--accent-soft)] border border-[color:var(--accent)] rounded-lg px-3 py-2 mx-1 shrink-0">
                            <span className="text-base">👇</span>
                            <span className="text-[10px] font-bold text-[color:var(--text-main)]">Your {pendingGuidedAction === 'usb' ? 'USB' : pendingGuidedAction === 'ble' ? 'BLE' : 'Battery'} rule type is pre-selected below — hit "+ Add" to create it.</span>
                        </div>
                    )}

                    <div className="flex flex-col gap-3 overflow-y-auto pr-2 pb-10 hide-scrollbar">
                        {staticScenes.map((s) => (
                            <div key={`s-${s._globalIdx}`} className="bg-[color:var(--bg-panel)] border-l-4 border-l-gray-400 border border-[color:var(--border-panel)] rounded-xl p-3 shadow-sm flex flex-col gap-3 highlight-rule">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2 font-bold text-xs">
                                        <span>🎨</span> <span>Static Base Color</span>
                                    </div>
                                    <button onClick={() => deleteStatic(s._globalIdx)} className="text-[10px] p-1.5 text-red-500 hover:bg-red-500/10 rounded font-bold">✕</button>
                                </div>
                                <div className="flex gap-3 items-center">
                                    <input type="color" value={s.color || "#000000"} onChange={e => updateStatic(s._globalIdx, 'color', e.target.value)} className="w-8 h-8 rounded cursor-pointer border border-[color:var(--border-panel)] p-0 bg-transparent shrink-0" />
                                    <input type="text" maxLength="7" value={s.color || "#000000"} onChange={e => updateStatic(s._globalIdx, 'color', e.target.value)} className="input-field py-1.5 px-2 text-xs font-mono w-20 text-center uppercase" />
                                    <select value={s.effect || 'solid'} onChange={e => updateStatic(s._globalIdx, 'effect', e.target.value)} className="input-field py-1.5 px-2 text-xs flex-1">
                                        <option value="solid">Solid Glow</option>
                                        <option value="blink">Blink</option>
                                        <option value="breath">Breath</option>
                                    </select>
                                </div>
                                {s.effect === 'blink' && <BlinkTimingFields s={s} onUpdate={(f, v) => updateStatic(s._globalIdx, f, v)} />}
                            </div>
                        ))}

                        {condScenes.length > 1 && (
                            <p className="text-[9px] text-[color:var(--text-muted)] italic px-1">When more than one rule below is true at once, the one lower in this list wins — use ▲▼ to reorder.</p>
                        )}
                        {condScenes.map((s, i) => {
                            let type = 'layer'; let icon = '🎯'; let title = 'Layer Active';
                            if (s.battery) { type = 'battery'; icon = '🔋'; title = `Battery (Node ${s.battery.node})`; }
                            else if (s.connection) { type = 'connection'; icon = s.connection.usb_connected !== undefined ? '🔌' : '📶'; title = s.connection.profile !== undefined ? `BLE Profile ${s.connection.profile + 1}` : `USB Connection`; }
                            else if (s.caps_lock) { type = 'lock'; icon = '🔠'; title = 'Caps Lock Active'; }
                            else if (s.num_lock) { type = 'lock'; icon = '🔢'; title = 'Num Lock Active'; }
                            else if (s.scroll_lock) { type = 'lock'; icon = '📜'; title = 'Scroll Lock Active'; }
                            else if (s.effects) { type = 'effects'; icon = '✨'; title = `RGB Effects ${s.effects.enabled ? 'Enabled' : 'Disabled'}`; }

                            return (
                                <div key={`c-${s._globalIdx}`} className={`bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] border-l-4 rounded-xl p-3 shadow-sm flex flex-col gap-3 highlight-rule ${type === 'battery' ? 'border-l-emerald-500' : type === 'connection' ? 'border-l-blue-500' : type === 'lock' ? 'border-l-purple-500' : type === 'effects' ? 'border-l-amber-500' : 'border-l-[color:var(--accent)]'}`}>
                                    <div className="flex justify-between items-center border-b border-[color:var(--border-panel)] pb-2">
                                        <div className="flex items-center gap-2 font-bold text-xs">
                                            <span>{icon}</span> <span>{title}</span>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <button onClick={() => i > 0 && moveCondRule(s._globalIdx, condScenes[i-1]._globalIdx)} disabled={i === 0} title="Move up (earlier = lower priority)" className="text-[10px] p-1 text-[color:var(--text-muted)] hover:text-[color:var(--accent)] hover:bg-[color:var(--accent-soft)] rounded font-bold disabled:opacity-25 disabled:pointer-events-none">▲</button>
                                            <button onClick={() => i < condScenes.length - 1 && moveCondRule(s._globalIdx, condScenes[i+1]._globalIdx)} disabled={i === condScenes.length - 1} title="Move down (later = higher priority — wins ties)" className="text-[10px] p-1 text-[color:var(--text-muted)] hover:text-[color:var(--accent)] hover:bg-[color:var(--accent-soft)] rounded font-bold disabled:opacity-25 disabled:pointer-events-none">▼</button>
                                            <button onClick={() => deleteCond(s._globalIdx)} className="text-[10px] p-1 text-red-500 hover:bg-red-500/10 rounded font-bold">✕</button>
                                        </div>
                                    </div>
                                   
                                    {type === 'battery' && (
                                        <div className="flex flex-col gap-2">
                                            <div className="flex gap-2">
                                                <select value={s.battery.node ?? 0} onChange={e=>updateCond(s._globalIdx, 'battery', parseInt(e.target.value), 'node')} className="input-field py-1.5 px-2 text-[10px] flex-1 font-bold text-[color:var(--text-main)]">
                                                    <option value="0">Left Keyboard (Node 0)</option>
                                                    <option value="1">Right Keyboard (Node 1)</option>
                                                </select>
                                                <select value={s.battery.charge ? 'charging' : 'level'} onChange={e=>{
                                                    updateConfig(prev => {
                                                        const next = JSON.parse(JSON.stringify(prev));
                                                        if(e.target.value === 'charging') { next.lighting.conditional_scene[s._globalIdx].battery = { node: s.battery.node ?? 0, min_level: 1, charge: "charging" }; }
                                                        else { next.lighting.conditional_scene[s._globalIdx].battery = { node: s.battery.node ?? 0, min_level: 20, max_level: 100 }; }
                                                        return next;
                                                    });
                                                }} className="input-field py-1.5 px-2 text-[10px] flex-1">
                                                    <option value="level">Level Range</option>
                                                    <option value="charging">Is Charging</option>
                                                </select>
                                            </div>
                                            {!s.battery.charge && (
                                                <div className="flex items-center gap-2 bg-[color:var(--bg-base)] p-1.5 rounded border border-[color:var(--border-panel)]">
                                                    <span className="text-[9px] font-bold text-[color:var(--text-muted)] w-8 text-center">MIN %</span>
                                                    <input type="number" min="0" max="100" value={s.battery.min_level ?? 0} onChange={e=>{ const v = parseInt(e.target.value, 10); updateCond(s._globalIdx, 'battery', Number.isNaN(v) ? 0 : v, 'min_level'); }} className="input-field py-1 px-2 text-[10px] w-14 font-mono text-center" />
                                                    <span className="text-[9px] font-bold text-[color:var(--text-muted)] w-8 text-center">MAX %</span>
                                                    <input type="number" min="0" max="100" value={s.battery.max_level ?? 100} onChange={e=>{ const v = parseInt(e.target.value, 10); updateCond(s._globalIdx, 'battery', Number.isNaN(v) ? 100 : v, 'max_level'); }} className="input-field py-1 px-2 text-[10px] w-14 font-mono text-center" />
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {type === 'connection' && (
                                        <div className="flex gap-2">
                                            <select value={s.connection.usb_connected !== undefined ? 'usb' : (s.connection.profile ?? s.connection.bonded?.slot ?? 0)} onChange={e=>{
                                                updateConfig(prev => {
                                                    const next = JSON.parse(JSON.stringify(prev));
                                                    next.lighting.conditional_scene[s._globalIdx].connection = {};
                                                    if(e.target.value === 'usb') next.lighting.conditional_scene[s._globalIdx].connection.usb_connected = true;
                                                    else { next.lighting.conditional_scene[s._globalIdx].connection.profile = parseInt(e.target.value); next.lighting.conditional_scene[s._globalIdx].connection.ble_state = 'connected'; }
                                                    return next;
                                                });
                                            }} className="input-field py-1.5 px-2 text-[10px] flex-1 font-bold text-[color:var(--text-main)]">
                                                <option value="usb">USB Wired</option>
                                                <option value="0">BLE Profile 1</option>
                                                <option value="1">BLE Profile 2</option>
                                                <option value="2">BLE Profile 3</option>
                                            </select>
                                            {s.connection.usb_connected === undefined && (
                                                <select value={s.connection.ble_state || (s.connection.bonded !== undefined ? (s.connection.bonded.bonded ? 'bonded' : 'unbonded') : 'connected')} onChange={e=>{
                                                    const prof = s.connection.profile ?? s.connection.bonded?.slot ?? 0;
                                                    updateConfig(prev => {
                                                        const next = JSON.parse(JSON.stringify(prev));
                                                        next.lighting.conditional_scene[s._globalIdx].connection = {};
                                                        if(e.target.value === 'bonded') next.lighting.conditional_scene[s._globalIdx].connection.bonded = { slot: prof, bonded: true };
                                                        else if(e.target.value === 'unbonded') next.lighting.conditional_scene[s._globalIdx].connection.bonded = { slot: prof, bonded: false };
                                                        else { next.lighting.conditional_scene[s._globalIdx].connection.profile = prof; next.lighting.conditional_scene[s._globalIdx].connection.ble_state = e.target.value; }
                                                        return next;
                                                    });
                                                }} className="input-field py-1.5 px-2 text-[10px] flex-1">
                                                    <option value="connected">Connected</option>
                                                    <option value="inactive">Inactive</option>
                                                    <option value="advertising">Pairing</option>
                                                    <option value="bonded">Bonded</option>
                                                    <option value="unbonded">Unbonded</option>
                                                </select>
                                            )}
                                        </div>
                                    )}

                                    {type === 'effects' && (
                                        <select value={s.effects.enabled ? 'true' : 'false'} onChange={e => updateCond(s._globalIdx, 'effects', e.target.value === 'true', 'enabled')} className="input-field py-1.5 px-2 text-[10px] flex-1 font-bold text-[color:var(--text-main)]">
                                            <option value="true">While RGB Effects Enabled</option>
                                            <option value="false">While RGB Effects Disabled</option>
                                        </select>
                                    )}

                                    <div className="flex gap-3 items-center mt-1">
                                        <input type="color" value={s.color || "#ffffff"} onChange={e => updateCond(s._globalIdx, 'color', e.target.value)} className="w-8 h-8 rounded cursor-pointer border border-[color:var(--border-panel)] p-0 bg-transparent shrink-0" />
                                        <input type="text" maxLength="7" value={s.color || "#ffffff"} onChange={e => updateCond(s._globalIdx, 'color', e.target.value)} className="input-field py-1.5 px-2 text-xs font-mono w-20 text-center uppercase" />
                                        <select value={s.effect || 'solid'} onChange={e => updateCond(s._globalIdx, 'effect', e.target.value)} className="input-field py-1.5 px-2 text-xs flex-1">
                                            <option value="solid">Solid Glow</option>
                                            <option value="blink">Blink</option>
                                            <option value="breath">Breath</option>
                                        </select>
                                    </div>
                                    {s.effect === 'blink' && <BlinkTimingFields s={s} onUpdate={(f, v) => updateCond(s._globalIdx, f, v)} />}
                                </div>
                            )
                        })}

                        {staticScenes.length === 0 && condScenes.length === 0 && (
                            <div className="text-[10px] text-center text-[color:var(--text-muted)] italic py-6 bg-[color:var(--bg-base)] border border-dashed border-[color:var(--border-panel)] rounded-xl m-1">
                                No lighting rules currently applied to this key on {getLayerLabel(config, activeLayer)}.
                            </div>
                        )}
                       
                        <div className="flex gap-2 mt-2 pt-4 border-t border-[color:var(--border-panel)] shrink-0">
                            <select value={newRuleType} onChange={e => { setNewRuleType(e.target.value); if (pendingGuidedAction && e.target.value !== pendingGuidedAction) setPendingGuidedAction(null); }} className="input-field py-2 px-3 text-xs font-bold text-[color:var(--accent)] flex-1 shadow-sm border border-[color:var(--accent-soft)]">
                                <option value="base" disabled={hasBaseRule}>{hasBaseRule ? 'Static Base Color (already set)' : 'Static Base Color'}</option>
                                <option value="battery">🔋 Battery Indicator</option>
                                <option value="usb">🔌 USB Connection</option>
                                <option value="ble">📶 BLE Connection</option>
                                <option value="caps">🔠 Caps Lock Active</option>
                                <option value="num">🔢 Num Lock Active</option>
                                <option value="scroll">📜 Scroll Lock Active</option>
                                <option value="effects_enabled">✨ RGB Effects Enabled</option>
                                <option value="layer_active">🎯 {getLayerLabel(config, activeLayer)} Active Indicator</option>
                            </select>
                            <button onClick={() => addRule(newRuleType)} className="bg-[color:var(--bg-panel)] text-[color:var(--text-main)] border border-[color:var(--border-panel)] hover:bg-[color:var(--accent)] hover:border-[color:var(--accent)] hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm shrink-0">+ Add</button>
                        </div>
                    </div>
                </div>
            );
        };

        const TrackerPanel = ({ config, updateConfig }) => {
            const { inUseBehaviors, matrixUsage, unused, error } = useMemo(() => {
                try {
                    const inUseBehaviorsArr = []; const unusedArr = [];
                    const defined = getDefinedBehaviors(config);

                    defined.forEach(def => {
                        const count = getUsageCount(config, def.ids);
                        if (count === 0) unusedArr.push({ block: def.block, keycode: def.label });
                        else inUseBehaviorsArr.push({ keycode: def.label, count, block: def.block });
                    });

                    const matrixCounts = {};
                    if (Array.isArray(config?.layer)) {
                        config.layer.forEach(l => {
                            if (Array.isArray(l.tokens)) {
                                l.tokens.forEach(t => {
                                    const txt = t?.text;
                                    if (txt) {
                                        if (!matrixCounts[txt]) matrixCounts[txt] = { count: 0, category: getCategory(txt, config) };
                                        matrixCounts[txt].count++;
                                    }
                                });
                            }
                        });
                    }

                    const groupedMatrix = {};
                    Object.entries(matrixCounts).sort((a,b) => b[1].count - a[1].count).forEach(([k, v]) => {
                        if (v.count > 0) {
                            if (!groupedMatrix[v.category]) groupedMatrix[v.category] = [];
                            groupedMatrix[v.category].push({ keycode: k, count: v.count });
                        }
                    });

                    return { inUseBehaviors: inUseBehaviorsArr, matrixUsage: groupedMatrix, unused: unusedArr, error: null };
                } catch (e) { return { inUseBehaviors: [], matrixUsage: {}, unused: [], error: e.message }; }
            }, [config]);

            const cleanUpUnused = () => {
                try {
                    let removedCount = 0;
                    updateConfig(prev => {
                        const next = JSON.parse(JSON.stringify(prev));
                        ['morse', 'tap_dance', 'macro', 'combo', 'mod_morph'].forEach(b => {
                            if (next[b] && Array.isArray(next[b])) {
                                next[b] = next[b].filter((item, idx) => {
                                    const ids = getIdentifiersForBlock(next, b, null, item, idx);
                                    if (getUsageCount(next, ids) === 0) { removedCount++; return false; }
                                    return true;
                                });
                                if (next[b].length === 0) delete next[b];
                            }
                        });
                        if (next.behavior) {
                            ['morse', 'tap_dance', 'mod_morph', 'macro'].forEach(type => {
                                if (next.behavior[type]?.profiles) {
                                    Object.keys(next.behavior[type].profiles).forEach(k => {
                                        if (getUsageCount(next, [k, `&${k}`]) === 0) { delete next.behavior[type].profiles[k]; removedCount++; }
                                    });
                                    if (Object.keys(next.behavior[type].profiles).length === 0) delete next.behavior[type].profiles;
                                }
                            });
                        }
                        return next;
                    });
                    alert(`Cleaned up ${removedCount} orphaned behaviors.`);
                } catch (e) { alert("Cleanup error: " + e.message); }
            };

            if (error) return <div className="p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-500 text-xs font-bold shadow-sm mb-4">Tracker Engine Error: {error}</div>;

            return (
                <div className="flex flex-col gap-6">
                    {unused.length > 0 && (
                        <div className="bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/30 rounded-xl p-4 shadow-sm relative overflow-hidden">
                            <h4 className="text-[10px] font-bold text-red-600 dark:text-red-400 uppercase tracking-widest mb-3 flex items-center gap-2">⚠️ Orphaned Behaviors ({unused.length})</h4>
                            <div className="flex flex-col gap-1.5 mb-4 max-h-48 overflow-y-auto pr-2">
                                {unused.map((u, i) => (
                                    <div key={i} className="flex justify-between items-center text-[10px]">
                                        <span className="font-mono text-[color:var(--text-main)] truncate" title={u.keycode}>{u.keycode}</span>
                                        <span className="text-[color:var(--text-muted)] italic">in {u.block}</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={cleanUpUnused} className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg text-xs transition-colors shadow-sm">✨ Clean Up Unused</button>
                        </div>
                    )}
                    {unused.length === 0 && <div className="text-emerald-500 text-xs text-center border border-emerald-500/20 bg-emerald-500/10 p-4 rounded-xl shadow-sm font-bold">🟢 All defined behaviors are actively utilized.</div>}
                   
                    {inUseBehaviors.length > 0 && (
                        <div className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-4 shadow-sm">
                            <h4 className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest mb-3 border-b border-[color:var(--border-panel)] pb-2">Custom Behaviors In Use</h4>
                            <div className="flex flex-col gap-1.5">
                                {inUseBehaviors.map((i, idx) => (
                                    <div key={idx} className="flex justify-between items-center text-xs">
                                        <span className="font-mono text-[color:var(--accent)] font-bold truncate max-w-[200px]" title={i.keycode}>{i.keycode}</span>
                                        <span className="text-[color:var(--text-muted)] font-mono text-[10px] bg-[color:var(--bg-base)] px-2 py-0.5 rounded border border-[color:var(--border-panel)] shadow-inner">{i.count} usages</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col gap-4">
                        {Object.entries(matrixUsage).map(([cat, items]) => (
                            <div key={cat} className="bg-[color:var(--bg-panel)] border border-[color:var(--border-panel)] rounded-xl p-4 shadow-sm">
                                <h4 className="text-[10px] font-bold text-[color:var(--text-muted)] uppercase tracking-widest mb-3 border-b border-[color:var(--border-panel)] pb-2">{cat}</h4>
                                <div className="flex flex-col gap-1.5">
                                    {items.map(i => (
                                        <div key={i.keycode} className="flex justify-between items-center text-xs">
                                            <span className="font-mono text-[color:var(--accent)] font-bold truncate max-w-[200px]" title={i.keycode}>{i.keycode}</span>
                                            <span className="text-[color:var(--text-muted)] font-mono text-[10px] bg-[color:var(--bg-base)] px-2 py-0.5 rounded border border-[color:var(--border-panel)] shadow-inner">{i.count}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SmartBlockItemCard = ({ item, idx, blockName, config, updateConfig, isFirst, isLast }) => {
            const [expanded, setExpanded] = useState(false);
            const identifiers = getIdentifiersForBlock(config, blockName, null, item, idx);
            const primaryId = identifiers[0] || `${blockName}[${idx}]`;
            const usage = getUsageCount(config, identifiers);

            const handleMove = (dir) => {
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    const temp = next[blockName][idx];
                    next[blockName][idx] = next[blockName][idx + dir];
                    next[blockName][idx + dir] = temp;

                    if (!item.name) {
                        const idsA = getImplicitIds(blockName, idx);
                        const idsB = getImplicitIds(blockName, idx+dir);
                        const TEMP = "__TEMP_SWAP__";
                        idsA.forEach(id => {
                            const regexA = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                            next.layer.forEach(l => l.tokens?.forEach(t => t.text = t.text.replace(regexA, `$1${TEMP}`)));
                        });
                        idsB.forEach((id, arrIdx) => {
                            const regexB = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                            next.layer.forEach(l => l.tokens?.forEach(t => t.text = t.text.replace(regexB, `$1${idsA[arrIdx]}`)));
                        });
                        next.layer.forEach(l => l.tokens?.forEach(t => { if (t.text.includes(TEMP)) t.text = t.text.replace(TEMP, idsB[0]); }));
                    }
                    return next;
                });
            };

            const handleDeleteArr = () => {
                if (usage > 0 && !confirm(`⚠️ Warning: Used by ${usage} references. Deleting resets those to KC_NO. Proceed?`)) return;
                updateConfig(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next[blockName].splice(idx, 1);
                    if (next[blockName].length === 0) delete next[blockName];

                    if (usage > 0) {
                        identifiers.forEach(id => {
                            const regex = new RegExp(`(^|\\W)(${String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                            next.layer.forEach(l => l.tokens?.forEach(t => { t.text = t.text.replace(regex, `$1KC_NO`); }));
                            ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => {
                                if (next[b]) next[b] = deleteInObj(next[b], identifiers);
                            });
                        });
                    }
                    for(let i = idx + 1; i <= (next[blockName]?.length || 0); i++) {
                        const oldIds = getImplicitIds(blockName, i);
                        const newIds = getImplicitIds(blockName, i - 1);
                        if (oldIds.length) {
                            oldIds.forEach((oldId, j) => {
                                const regex = new RegExp(`(^|\\W)(${String(oldId).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?=\\W|$)`, 'g');
                                next.layer.forEach(l => l.tokens?.forEach(t => t.text = t.text.replace(regex, `$1${newIds[j]}`)));
                                ['behavior', 'macro', 'combo', 'mod_morph', 'tap_dance', 'morse'].forEach(b => {
